<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>WC26 Matchday — FIFA World Cup 2026 Data Explorer</title>
<meta name="description" content="Explore every squad, lineup, club and match of the 2026 FIFA World Cup — 1,247 players, 48 teams, 104 matches."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#080b10; --bg1:#0c1119; --bg2:#10161f; --bg3:#151c28; --line:#1e2735; --line2:#2a3647;
  --fg:#eaf0f7; --fg-dim:#93a1b5; --fg-mute:#5f6e82;
  --accent:#34e29b; --accent2:#5aa2ff; --warn:#ffb454; --pink:#ff6b9d; --violet:#b48cff;
  --radius:14px; --sh:0 8px 30px rgba(0,0,0,.4);
  --fdisp:'Archivo',system-ui,sans-serif; --fmono:'IBM Plex Mono',ui-monospace,monospace;
  --fbody:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#f4f6fa; --bg1:#ffffff; --bg2:#f0f3f8; --bg3:#e9eef5; --line:#dde4ee; --line2:#cdd7e6;
  --fg:#16202e; --fg-dim:#52617a; --fg-mute:#8493a8; --sh:0 8px 26px rgba(20,40,80,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fbody);color:var(--fg);background:
  radial-gradient(1200px 560px at 86% -10%,rgba(52,226,155,.06),transparent 60%),
  radial-gradient(900px 500px at 0% 0%,rgba(90,162,255,.06),transparent 55%),
  linear-gradient(var(--bg),var(--bg));
  background-attachment:fixed;-webkit-font-smoothing:antialiased;line-height:1.55;font-size:14px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:54px 54px;opacity:.20;-webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
a{color:inherit;text-decoration:none;cursor:pointer}
.mono{font-family:var(--fmono);font-variant-numeric:tabular-nums}
.faint{color:var(--fg-dim)}
h1{font-family:var(--fdisp);font-weight:800;letter-spacing:-.02em;margin:.1em 0;font-size:clamp(1.5rem,3.2vw,2.2rem);line-height:1.08}
h2.sec{font-family:var(--fdisp);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.14em;color:var(--fg-dim);margin:26px 2px 12px}
h3{font-family:var(--fdisp);font-weight:600;font-size:14.5px;margin:0 0 13px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tag{font-family:var(--fbody);font-size:11px;color:var(--fg-mute);font-weight:400}
.skip{position:fixed;left:-999px;top:8px;z-index:200;background:var(--accent);color:#04241a;padding:8px 14px;border-radius:8px}
.skip:focus{left:8px}
/* topbar */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:18px;padding:11px 22px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fdisp);font-weight:700;font-size:16px}
.brand b{color:var(--accent)}
.ball{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 40deg,#fff 0 25%,#0a0e13 0 50%,#fff 0 75%,#0a0e13 0);box-shadow:0 0 0 2px var(--accent) inset}
#nav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav a{padding:7px 11px;border-radius:8px;color:var(--fg-dim);font-size:13px;white-space:nowrap;font-weight:500}
#nav a:hover{color:var(--fg);background:var(--bg2)}
#nav a.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.actions{display:flex;gap:7px}
main{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:18px 22px 70px}
.foot{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:24px 22px 50px;font-size:12px;border-top:1px solid var(--line)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line2);color:var(--fg);
  padding:9px 14px;border-radius:10px;font-size:13px;cursor:pointer;font-family:var(--fbody);transition:.15s cubic-bezier(.22,.61,.36,1)}
.btn:hover{border-color:var(--accent2);transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#04241a;border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.btn.back{margin-bottom:14px}
.kbtn{font-family:var(--fmono)}
/* panels & cards */
.panel{background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0;box-shadow:var(--sh)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
/* hero */
.hero{padding:40px 6px 14px}
.eyebrow{font-family:var(--fmono);font-size:12px;letter-spacing:.1em;color:var(--accent)}
.hero h1{font-size:clamp(2rem,5.5vw,3.4rem);max-width:14ch;margin-top:10px}
.hero .accent{color:var(--accent)}
.lede{color:var(--fg-dim);max-width:60ch;font-size:15px;margin:12px 0 20px}
.herobtns{display:flex;gap:10px;flex-wrap:wrap}
.storygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.story{background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s cubic-bezier(.22,.61,.36,1)}
.story:hover{border-color:var(--accent2);transform:translateY(-2px)}
.story .big{font-family:var(--fdisp);font-weight:800;font-size:26px;letter-spacing:-.02em}
.story .lab{font-weight:600;margin-top:3px;font-size:13.5px}
.story .sub{font-size:12px;margin-top:3px}
.explore{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
.ecard{background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius);padding:16px;transition:.15s}
.ecard:hover{border-color:var(--accent);transform:translateY(-2px)}
.ecard .eh{font-family:var(--fdisp);font-weight:600;margin-bottom:4px}
/* team grid */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px}
.gcard{background:var(--bg1);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.gh{font-family:var(--fdisp);font-weight:700;color:var(--accent);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.trow{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border-radius:9px;transition:.1s}
.trow:hover{background:var(--bg2)}
.trow .fl{font-size:16px}.trow .rk{color:var(--fg-mute);font-family:var(--fmono);font-size:12px}
.gtable{width:100%;border-collapse:collapse;font-size:12.5px}
.gtable th,.gtable td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line)}
.gtable tr{cursor:pointer}.gtable tr:hover td{background:var(--bg2)}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--fg-dim);font-weight:600;font-size:11.5px;cursor:pointer;position:sticky;top:0;background:var(--bg1);z-index:2;user-select:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--bg2)}
.tablewrap{max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:11px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
input,select{background:var(--bg2);border:1px solid var(--line2);color:var(--fg);padding:9px 12px;border-radius:10px;font-size:13px;font-family:var(--fbody);outline:none}
input:focus,select:focus{border-color:var(--accent2)}
input{min-width:210px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg2);border:1px solid var(--line2);color:var(--fg-dim);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:12px;transition:.12s}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--accent);color:#04241a;border-color:var(--accent);font-weight:700}
.count{color:var(--fg-mute);font-size:12px;margin-left:auto;font-family:var(--fmono)}
.pill{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.3px}
.pill.GK{background:#3a2e10;color:#ffd479}.pill.DF{background:#10233a;color:#7fb6ff}
.pill.MF{background:#0f2e22;color:#5ce0a8}.pill.FW{background:#34121f;color:#ff8fb0}
.ar{color:var(--accent);font-size:10px}
/* team page */
.teamhead{display:flex;align-items:center;gap:16px;padding:18px;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(110deg,color-mix(in srgb,var(--c) 16%,var(--bg1)),var(--bg1) 55%)}
.thflag{font-size:46px;line-height:1}
.subtabs{display:flex;gap:7px;margin:14px 0}
.subtab{background:var(--bg2);border:1px solid var(--line2);color:var(--fg-dim);padding:7px 17px;border-radius:999px;cursor:pointer;font-size:13px}
.subtab.on{background:var(--accent);color:#04241a;border-color:var(--accent);font-weight:700}
.kv{display:grid;grid-template-columns:150px 1fr;gap:7px 12px;font-size:13px}
.kv .k{color:var(--fg-dim)}
.sublabel{margin:16px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
/* pitch */
.pitchwrap{display:grid;grid-template-columns:minmax(290px,1.05fr) .95fr;gap:15px}
@media(max-width:920px){.pitchwrap{grid-template-columns:1fr}}
.formrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.pitch{position:relative;aspect-ratio:68/104;border-radius:16px;overflow:hidden;
  background:repeating-linear-gradient(0deg,#0f3d27 0 9.09%,#0d3522 9.09% 18.18%);
  border:2px solid #1f6342;box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.pitch.tall{aspect-ratio:68/116}
.pitch .line{position:absolute;border:2px solid rgba(255,255,255,.22)}
.pitch .ch{left:6%;right:6%;top:50%;width:88%;height:0;border-width:1px 0 0 0;transform:translateY(-50%)}
.pitch .cc{left:50%;top:50%;width:22%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.pitch .box{left:22%;width:56%;height:14%}
.pitch .box.top{top:0;border-top:0}.pitch .box.bot{bottom:0;border-bottom:0}
.pitch .six{left:36%;width:28%;height:6%}
.pitch .six.top{top:0;border-top:0}.pitch .six.bot{bottom:0;border-bottom:0}
.token{position:absolute;transform:translate(-50%,-50%);width:60px;text-align:center;cursor:pointer;z-index:3;transition:.12s}
.token:hover{filter:brightness(1.14)}
.token.sm{width:48px}
.token .sh{width:40px;height:40px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
  font-family:var(--fmono);font-weight:600;color:#062a1c;font-size:14px;border:2px solid rgba(255,255,255,.8);box-shadow:0 3px 9px rgba(0,0,0,.45);position:relative}
.token.sm .sh{width:30px;height:30px;font-size:12px}
.token .cap{position:absolute;top:-5px;right:-5px;background:#ffd479;color:#3a2e10;font-size:8px;font-style:normal;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #062a1c}
.token .nm{font-size:10px;margin-top:3px;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;font-weight:600}
.token.sel .sh{outline:3px solid #fff;outline-offset:1px}
.hint{margin-top:11px;font-size:12.5px}.hint.live{color:var(--accent)}
.benchlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;max-height:560px;overflow:auto}
.pcard{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer;transition:.12s}
.pcard:hover{border-color:var(--accent2)}.pcard.sel{border-color:#fff;background:var(--bg3)}
.pcard .pcrow{display:flex;justify-content:space-between;align-items:center}
.pcard .nm{font-weight:600;font-size:12.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .meta{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .mini{font-size:11px;color:var(--accent2)}
/* player page */
.playerhead{display:flex;align-items:center;gap:18px;padding:18px;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(110deg,color-mix(in srgb,var(--c) 16%,var(--bg1)),var(--bg1) 55%)}
.phnum{font-family:var(--fmono);font-size:40px;font-weight:600;color:var(--c);width:64px;text-align:center}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.stat .v{font-size:19px;font-weight:700}.stat .k{font-size:11px;color:var(--fg-dim)}
.src{font-size:11px;word-break:break-all;margin:3px 0}.src a{color:var(--accent2)}
/* bars */
.barrow{display:grid;grid-template-columns:140px 1fr 46px;gap:10px;align-items:center;margin:6px 0;font-size:12px}
.bartrack{background:var(--bg3);border-radius:6px;overflow:hidden;height:10px}
.bar{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bar.alt{background:linear-gradient(90deg,var(--warn),var(--pink))}
.lead{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border-radius:8px;cursor:pointer}
.lead:hover{background:var(--bg2)}.lead .rk{color:var(--fg-mute);width:22px;display:inline-block;font-family:var(--fmono)}
/* bracket — connected tournament tree */
.brkhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:6px}
.bktwrap{overflow-x:auto;padding:6px 2px 14px;margin:6px 0}
.bktree{position:relative}
.bcons{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
.bcon{fill:none;stroke:var(--line2);stroke-width:1.6}
.bcon.win{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4}
.bhead{position:absolute;top:8px;font-family:var(--fdisp);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-dim);text-align:center}
.bnode{position:absolute;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:3px;
  background:var(--bg1);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:11px;
  padding:7px 10px;cursor:pointer;text-align:left;font-family:var(--fbody);color:var(--fg);
  box-shadow:var(--sh);transition:.14s cubic-bezier(.22,.61,.36,1)}
.bnode:hover{border-color:var(--accent);border-left-color:var(--accent);transform:translateY(-2px) scale(1.015)}
.bnode.r1{border-left-color:#7fb6ff}.bnode.r2{border-left-color:var(--violet)}
.bnode.r3{border-left-color:var(--warn)}.bnode.r4{border-left-color:var(--accent)}
.brow{display:flex;align-items:center;gap:7px;min-width:0}
.bchip{flex:none;min-width:26px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:5px;font-family:var(--fmono);font-size:10px;font-weight:600;color:#e7eef8}
.blabel{font-size:11.5px;color:var(--fg-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnode .bvs{display:flex;align-items:center;gap:6px;font-size:8.5px;color:var(--fg-mute);text-transform:uppercase;letter-spacing:.1em}
.bnode .bvs::before,.bnode .bvs::after{content:"";flex:1;height:1px;background:var(--line)}
.bnum{font-family:var(--fmono);font-size:9.5px;color:var(--fg-mute);margin-top:1px}
.bchamp{position:absolute;z-index:1;width:170px;text-align:center;padding:14px 12px;border-radius:12px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 18%,var(--bg1)),var(--bg1));
  border:1px solid var(--accent);box-shadow:0 0 24px -8px var(--accent)}
.bchamp .trophy{font-size:30px}.bchamp .ct{font-family:var(--fdisp);font-weight:700;margin-top:4px}.bchamp .cs{font-size:11px;margin-top:4px}
.kv .bchip{align-self:center}
/* match page */
/* match page */
.matchhead{text-align:center;padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg1)}
.ms{font-family:var(--fmono);font-size:12px;color:var(--accent)}
.mscore{font-family:var(--fdisp);font-weight:700;font-size:clamp(1.2rem,3vw,1.8rem);margin:6px 0;display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
.mv{color:var(--fg-mute);font-size:14px}
.mhead{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px;font-size:13px}
.tape{display:grid;grid-template-columns:1fr auto 1fr;margin-bottom:8px}
.taperow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.taperow .tl{color:var(--fg-dim);font-size:11.5px;padding:0 14px;text-transform:uppercase;letter-spacing:.06em}
.taperow span:first-child{text-align:right}
/* map */
.mapbox{position:relative;aspect-ratio:1.4;background:
  radial-gradient(circle at 40% 35%,rgba(90,162,255,.10),transparent 60%),var(--bg2);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cdot2{position:absolute;transform:translate(-50%,-50%);background:var(--accent);border-radius:50%;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.clab{position:absolute;transform:translate(-50%,-160%);font-size:10px;color:var(--fg-dim);white-space:nowrap}
/* compare */
.cmpwrap{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:center}
@media(max-width:760px){.cmpwrap{grid-template-columns:1fr}}
.radar{width:100%;max-width:260px}
.rring{fill:none;stroke:var(--line2);stroke-width:1}
.raxis{stroke:var(--line);stroke-width:1}
.rlab{fill:var(--fg-dim);font-size:9px;font-family:var(--fbody)}
.cmpleg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-weight:600}
/* palette */
.palette{position:fixed;inset:0;z-index:120;display:none;align-items:flex-start;justify-content:center;
  background:rgba(4,7,11,.6);backdrop-filter:blur(4px);padding-top:12vh}
.palette.show{display:flex}
.palbox{width:min(620px,92vw);background:var(--bg1);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px 18px;font-size:15px;background:transparent}
.palres{max-height:50vh;overflow:auto}
.palrow{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;padding:9px 16px;cursor:pointer;font-size:13px}
.palrow.sel,.palrow:hover{background:var(--bg2)}
.palk{font-size:15px;text-align:center}.palsub{font-size:11px}.palt{font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.palfoot{padding:9px 16px;border-top:1px solid var(--line);font-size:11px;font-family:var(--fmono)}
.meth{margin:0;padding-left:18px;font-size:13px;color:var(--fg-dim)}.meth li{margin:6px 0}
.vsrow{display:flex;justify-content:space-between}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<noscript>This dashboard needs JavaScript and must be served over http (run <code>build_data.py</code>, then a static server).</noscript>
<div style="padding:40px;font-family:sans-serif;color:#93a1b5">Loading WC26 Matchday…</div>
<script src="app.js"></script>
</body>
</html>
