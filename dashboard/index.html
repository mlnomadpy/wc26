<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FIFA World Cup 2026 — Data Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0e13; --bg2:#0d1219; --panel:#121925; --panel2:#171f2d; --line:#212c3d;
    --txt:#e9eef6; --muted:#8493a8; --faint:#5d6b80;
    --accent:#3ddc97; --accent2:#4f9cff; --warn:#ffb454; --pink:#ff6b9d; --violet:#b48cff;
    --radius:14px; --sh:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:
    radial-gradient(1100px 520px at 88% -8%,#10202f 0,transparent 60%),
    radial-gradient(900px 500px at 0% 0%,#101a26 0,transparent 55%),var(--bg);
    color:var(--txt);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{padding:24px 30px 0;position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg,rgba(10,14,19,.96),rgba(10,14,19,.82));
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px}
  .ball{width:30px;height:30px;border-radius:50%;background:
    conic-gradient(from 45deg,#fff 0 25%,#0a0e13 0 50%,#fff 0 75%,#0a0e13 0);
    box-shadow:0 0 0 2px var(--accent) inset, var(--sh)}
  h1{margin:0;font-size:20px;letter-spacing:.2px;font-weight:700}
  h1 .em{color:var(--accent)}
  .sub{color:var(--muted);margin-top:3px;font-size:12.5px}
  .wrap{padding:18px 30px 70px;max-width:1340px;margin:0 auto}
  nav{display:flex;gap:4px;flex-wrap:wrap;padding:12px 0 0}
  nav button{background:transparent;color:var(--muted);border:0;border-bottom:2px solid transparent;
    padding:10px 14px;cursor:pointer;font-size:13.5px;transition:.15s;font-weight:500}
  nav button:hover{color:var(--txt)}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:18px 0}
  .card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
  .card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .card .n{font-size:28px;font-weight:750;letter-spacing:-.5px}
  .card .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px;margin-top:3px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:16px 0}
  .panel h3{margin:0 0 14px;font-size:14.5px;display:flex;align-items:center;gap:8px}
  .panel h3 .tag{font-size:11px;color:var(--muted);font-weight:400}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;
    background:var(--panel);z-index:2;font-size:12px}
  th .ar{opacity:.5;font-size:10px}
  tbody tr{cursor:pointer;transition:background .1s}
  tbody tr:hover{background:var(--panel2)}
  .tablewrap{max-height:640px;overflow:auto;border-radius:10px;border:1px solid var(--line)}
  .pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px}
  .GK{background:#3a2e10;color:#ffd479}.DF{background:#10233a;color:#7fb6ff}
  .MF{background:#0f2e22;color:#5ce0a8}.FW{background:#34121f;color:#ff8fb0}
  .cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .conf{font-size:11px;color:var(--muted)}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:9px 12px;border-radius:9px;font-size:13px;outline:none}
  input:focus,select:focus{border-color:var(--accent2)}
  input{min-width:210px}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:6px 12px;
    border-radius:999px;cursor:pointer;font-size:12px;transition:.12s}
  .chip:hover{color:var(--txt)}
  .chip.on{background:var(--accent);color:#06281c;border-color:var(--accent);font-weight:700}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 14px;
    border-radius:9px;cursor:pointer;font-size:13px;transition:.12s}
  .btn:hover{border-color:var(--accent2);color:#fff}
  .count{color:var(--faint);font-size:12px;margin-left:auto}
  .groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
  .group h4{margin:0 0 10px;color:var(--accent);font-size:13px;letter-spacing:.5px;text-transform:uppercase}
  .grow{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;border-radius:8px;cursor:pointer}
  .grow:hover{background:var(--panel2)}
  .grow .rk{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
  .flag{font-weight:800;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}.faint{color:var(--faint)}
  .barrow{display:grid;grid-template-columns:150px 1fr 52px;gap:10px;align-items:center;margin:7px 0;font-size:12px}
  .bartrack{background:#1a2433;border-radius:6px;overflow:hidden;height:10px}
  .bar{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  canvas{max-height:300px}
  a{color:var(--accent2);text-decoration:none}
  .banner{display:flex;gap:12px;align-items:center;background:#1c2230;border:1px solid #2a3548;
    border-radius:12px;padding:12px 16px;margin:16px 0;font-size:13px}
  .spin{width:16px;height:16px;border:2px solid var(--faint);border-top-color:var(--accent);
    border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .lead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer}
  .lead:hover{background:var(--panel2)}
  .lead .rk{color:var(--faint);width:22px;display:inline-block;font-variant-numeric:tabular-nums}
  /* drawer + modal */
  .scrim{position:fixed;inset:0;background:rgba(4,7,11,.6);backdrop-filter:blur(3px);z-index:90;
    opacity:0;pointer-events:none;transition:.2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,94vw);background:var(--bg2);
    border-left:1px solid var(--line);z-index:100;transform:translateX(100%);transition:transform .25s ease;
    overflow:auto;box-shadow:-12px 0 40px rgba(0,0,0,.5)}
  .drawer.show{transform:translateX(0)}
  .dhead{position:sticky;top:0;background:var(--bg2);padding:20px 22px 14px;border-bottom:1px solid var(--line);z-index:2}
  .dbody{padding:18px 22px 40px}
  .x{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
  .x:hover{color:#fff}
  .kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px;margin:10px 0}
  .kv .k{color:var(--muted)}
  .sec{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent)}
  .poschip{font-size:10px}
  .statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat .v{font-size:20px;font-weight:700}.stat .k{font-size:11px;color:var(--muted)}
  .src a{font-size:11px;word-break:break-all}
  .squadrow{display:flex;justify-content:space-between;padding:6px 8px;border-radius:7px;cursor:pointer}
  .squadrow:hover{background:var(--panel)}
  /* team page */
  .bigflag{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#06281c;font-size:15px;letter-spacing:.5px;box-shadow:var(--sh)}
  .subtabs{display:flex;gap:6px;margin-top:14px}
  .subtab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:7px 16px;
    border-radius:999px;cursor:pointer;font-size:13px}
  .subtab:hover{color:var(--txt)}
  .subtab.on{background:var(--accent);color:#06281c;border-color:var(--accent);font-weight:700}
  .pitchwrap{display:grid;grid-template-columns:minmax(300px,1.05fr) .95fr;gap:16px}
  @media(max-width:920px){.pitchwrap{grid-template-columns:1fr}}
  .formrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .pitch{position:relative;aspect-ratio:68/104;border-radius:16px;overflow:hidden;
    background:
      repeating-linear-gradient(0deg,#0f3d27 0 9.09%,#0d3522 9.09% 18.18%);
    border:2px solid #1f6342;box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
  .pitch .line{position:absolute;border:2px solid rgba(255,255,255,.22)}
  .pitch .ch{left:6%;right:6%;top:50%;width:88%;height:0;border-width:1px 0 0 0;transform:translateY(-50%)}
  .pitch .cc{left:50%;top:50%;width:22%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
  .pitch .box{left:22%;width:56%;height:15%}
  .pitch .box.top{top:0;border-top:0}.pitch .box.bot{bottom:0;border-bottom:0}
  .pitch .six{left:35%;width:30%;height:6.5%}
  .pitch .six.top{top:0;border-top:0}.pitch .six.bot{bottom:0;border-bottom:0}
  .token{position:absolute;transform:translate(-50%,-50%);width:60px;text-align:center;cursor:pointer;z-index:3;transition:.12s}
  .token:hover{filter:brightness(1.12)}
  .token .sh{width:42px;height:42px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#06281c;font-size:15px;border:2px solid rgba(255,255,255,.8);
    box-shadow:0 3px 9px rgba(0,0,0,.45);position:relative}
  .token .cap{position:absolute;top:-5px;right:-5px;background:#ffd479;color:#3a2e10;font-size:9px;
    width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #06281c}
  .token .nm{font-size:10.5px;margin-top:3px;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;font-weight:600}
  .token.sel .sh{outline:3px solid #fff;outline-offset:1px}
  .token.drop .sh{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}50%{box-shadow:0 0 0 7px rgba(255,255,255,0)}}
  .hint{margin-top:12px;font-size:12.5px;color:var(--accent)}
  .benchlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;max-height:560px;overflow:auto}
  .pcard{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer;transition:.12s}
  .pcard:hover{border-color:var(--accent2)}
  .pcard.sel{border-color:#fff;background:#1d2738}
  .pcard .nm{font-weight:600;font-size:12.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="ball"></div>
    <div><h1>FIFA World Cup <span class="em">2026</span> — Data Explorer</h1>
    <div class="sub" id="subline">Loading…</div></div></div>
  <nav id="nav"></nav>
</header>
<div class="wrap"><div id="view"></div></div>
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<script>
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
let DB=null,charts=[];
const CONF={UEFA:'#4f9cff',CONMEBOL:'#3ddc97',CAF:'#ffb454',AFC:'#ff6b9d',CONCACAF:'#b48cff',OFC:'#65d6ce',Unknown:'#5d6b80'};
const POSC={GK:'#ffd479',DF:'#7fb6ff',MF:'#5ce0a8',FW:'#ff8fb0'};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>n==null?'':Number(n).toLocaleString('en-US');
const money=v=>v==null?'':v>=1e6?'€'+(v/1e6).toFixed(v>=1e7?0:1)+'M':v>=1e3?'€'+Math.round(v/1e3)+'K':'€'+v;

fetch('data.json?_='+Date.now()).then(r=>r.json()).then(d=>{DB=d;init();})
  .catch(()=>{$('#subline').textContent='Could not load data.json — run build_data.py and serve over http.';});

function init(){
  const t=DB.totals;
  $('#subline').innerHTML=`${t.squads_loaded}/48 squads · <b>${num(t.players)}</b> players · ${t.clubs} clubs · ${t.leagues} leagues · ${t.matches} matches · ${t.host_cities} cities · built ${DB.generated_at}`;
  const tabs=['Overview','Groups','Teams','Players','Clubs','Player Stats','Schedule','Insights'];
  const nav=$('#nav');
  tabs.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;
    b.onclick=()=>{$$('button',nav).forEach(c=>c.classList.remove('active'));b.classList.add('active');route(name);};
    if(i===0)b.classList.add('active');nav.appendChild(b);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
  route('Overview');
}
function clearCharts(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[];}
const VIEWS={};
let currentTab='Overview';
function route(tab){currentTab=tab;clearCharts();const v=$('#view');v.innerHTML='';VIEWS[tab](v);window.scrollTo(0,0);}

/* ---------- Overview ---------- */
VIEWS['Overview']=v=>{
  const t=DB.totals;
  const kpis=[['teams','Teams'],['players','Players'],['clubs','Clubs'],['leagues','Leagues'],['matches','Matches'],['host_cities','Host cities']];
  v.innerHTML=`<div class="cards">${kpis.map(([k,l])=>`<div class="card"><div class="n" data-cu="${t[k]}">0</div><div class="l">${l}</div></div>`).join('')}</div>
   ${DB.has_enrichment?'':`<div class="banner"><div class="spin"></div><div><b>Per-player stat enrichment in progress.</b> Club season stats fill in once the research workflow finishes — re-run <code>build_data.py</code> to refresh. Tier-1 data (squads, clubs, caps, goals) is complete.</div></div>`}
   <div class="grid2">
     <div class="panel"><h3>Players by confederation</h3><canvas id="c1"></canvas></div>
     <div class="panel"><h3>Squad age distribution</h3><canvas id="c2"></canvas></div></div>
   <div class="grid2">
     <div class="panel"><h3>Top 15 leagues <span class="tag">by players represented</span></h3><canvas id="c3"></canvas></div>
     <div class="panel"><h3>Field-coverage <span class="tag">filled / ${num(t.players)} — null = not fabricated</span></h3><div id="cov"></div></div></div>`;
  countUp();
  doughnut('c1',DB.agg.by_confederation,k=>CONF[k]||'#888');
  barChart('c2',DB.agg.age_buckets,'#4f9cff');
  barChart('c3',DB.agg.by_league,'#3ddc97',true);
  const cov=DB.agg.coverage,tot=t.players,el=$('#cov');
  el.innerHTML=Object.entries(cov).map(([k,n])=>{const p=tot?Math.round(n/tot*100):0;
    return `<div class="barrow"><span>${k}</span><div class="bartrack"><div class="bar" style="width:${p}%"></div></div><span class="faint">${p}%</span></div>`;}).join('');
};

/* ---------- Groups ---------- */
VIEWS['Groups']=v=>{
  const byG={};DB.teams.forEach(t=>{(byG[t.group_letter]=byG[t.group_letter]||[]).push(t);});
  v.innerHTML='<div class="groups">'+Object.keys(byG).sort().map(g=>
    `<div class="panel group"><h4>Group ${g}</h4>`+byG[g].map(t=>
      `<div class="grow" onclick="teamDrawer('${t.fifa_code}')">
        <span><span class="cdot" style="background:${CONF[t.confederation]||'#888'}"></span><span class="flag">${t.fifa_code}</span> ${esc(t.team_name)}</span>
        <span class="rk">${t.fifa_ranking?'#'+t.fifa_ranking:'—'}</span></div>`).join('')+'</div>').join('')+'</div>';
};

/* ---------- Teams ---------- */
let tSort={k:'group_letter',d:1};
VIEWS['Teams']=v=>{
  v.innerHTML=`<div class="panel"><h3>All 48 teams <span class="tag">click a row for the full squad</span></h3>
   <div class="tablewrap"><table><thead><tr>${
     [['group_letter','Grp'],['fifa_code','Code'],['team_name','Team'],['confederation','Conf'],['head_coach','Coach'],['fifa_ranking','Rank'],['squad_size','Squad'],['qualification_method','Qualified via']]
     .map(([k,l])=>`<th data-k="${k}">${l} <span class="ar"></span></th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div></div>`;
  const draw=()=>{const r=[...DB.teams].sort(cmp(tSort));
    $('#tb').innerHTML=r.map(t=>`<tr onclick="teamDrawer('${t.fifa_code}')">
      <td>${t.group_letter}</td><td class="flag">${t.fifa_code}</td><td>${esc(t.team_name)}</td>
      <td><span class="cdot" style="background:${CONF[t.confederation]||'#888'}"></span><span class="conf">${t.confederation||'—'}</span></td>
      <td>${esc(t.head_coach)||'<span class=faint>—</span>'}</td><td>${t.fifa_ranking||'<span class=faint>—</span>'}</td>
      <td>${t.squad_size||0}</td><td class="muted">${esc(t.qualification_method)||'—'}</td></tr>`).join('');
    markSort('#tb',tSort);};
  hookSort(v,tSort,draw);draw();
};

/* ---------- Players ---------- */
let pSort={k:'caps',d:-1},pFilter={q:'',team:'',conf:'',pos:'',sort:'caps'};
VIEWS['Players']=v=>{
  const teams=[...new Set(DB.players.map(p=>p.team_name))].sort();
  v.innerHTML=`<div class="panel">
    <div class="controls">
      <input id="q" placeholder="Search player or club…" value="${esc(pFilter.q)}"/>
      <select id="ft"><option value="">All teams</option>${teams.map(t=>`<option ${pFilter.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select>
      <select id="fc"><option value="">All confederations</option>${Object.keys(CONF).filter(c=>c!=='Unknown').map(c=>`<option ${pFilter.conf===c?'selected':''}>${c}</option>`).join('')}</select>
      <div class="chips" id="poschips">${['','GK','DF','MF','FW'].map(p=>`<span class="chip ${pFilter.pos===p?'on':''}" data-p="${p}">${p||'All'}</span>`).join('')}</div>
      <button class="btn" id="exp">⬇ CSV</button><span class="count" id="cnt"></span></div>
    <div class="tablewrap"><table><thead><tr>${
      [['shirt_number','#'],['position','Pos'],['player_name','Player'],['fifa_code','Team'],['age','Age'],['club','Club'],['club_country','Club country'],['caps','Caps'],['international_goals','Goals']]
      .map(([k,l])=>`<th data-k="${k}">${l} <span class="ar"></span></th>`).join('')}</tr></thead><tbody id="pb"></tbody></table></div></div>`;
  let cur=[];
  const draw=()=>{const q=pFilter.q.toLowerCase();
    cur=DB.players.filter(p=>(!pFilter.team||p.team_name===pFilter.team)&&(!pFilter.conf||p.confederation===pFilter.conf)
      &&(!pFilter.pos||p.position===pFilter.pos)
      &&(!q||(p.player_name||'').toLowerCase().includes(q)||(p.club||'').toLowerCase().includes(q)));
    cur.sort(cmp(pSort));
    $('#cnt').textContent=`${cur.length} players`;
    $('#pb').innerHTML=cur.map(p=>`<tr onclick="playerDrawer(${p.player_id})">
      <td>${p.shirt_number??''}</td><td><span class="pill ${p.position}">${p.position||''}</span></td>
      <td>${esc(p.player_name)}${p.is_captain?' <span class="faint">(C)</span>':''}</td><td class="flag">${p.fifa_code}</td>
      <td>${p.age??''}</td><td>${esc(p.club)}</td><td class="muted">${esc(p.club_country)}</td>
      <td>${p.caps??''}</td><td>${p.international_goals??''}</td></tr>`).join('')||'<tr><td colspan=9 class=faint>No players match.</td></tr>';
    markSort('#pb',pSort);};
  let deb;$('#q').oninput=e=>{pFilter.q=e.target.value;clearTimeout(deb);deb=setTimeout(draw,120);};
  $('#ft').onchange=e=>{pFilter.team=e.target.value;draw();};
  $('#fc').onchange=e=>{pFilter.conf=e.target.value;draw();};
  $$('#poschips .chip').forEach(c=>c.onclick=()=>{pFilter.pos=c.dataset.p;$$('#poschips .chip').forEach(x=>x.classList.toggle('on',x.dataset.p===pFilter.pos));draw();});
  $('#exp').onclick=()=>exportCSV(cur);
  hookSort(v,pSort,draw);draw();
};

/* ---------- Clubs ---------- */
VIEWS['Clubs']=v=>{
  const byClub={};DB.players.forEach(p=>{if(p.club){(byClub[p.club]=byClub[p.club]||[]).push(p);}});

/* ===== Formations & projected-XI engine ===== */
const FORMATIONS={
 '4-3-3':[['GK',50,90],['DF',16,72],['DF',38,75],['DF',62,75],['DF',84,72],['MF',30,52],['MF',50,55],['MF',70,52],['FW',22,26],['FW',50,20],['FW',78,26]],
 '4-4-2':[['GK',50,90],['DF',16,72],['DF',38,75],['DF',62,75],['DF',84,72],['MF',16,50],['MF',39,52],['MF',61,52],['MF',84,50],['FW',36,24],['FW',64,24]],
 '4-2-3-1':[['GK',50,90],['DF',16,73],['DF',38,76],['DF',62,76],['DF',84,73],['MF',38,60],['MF',62,60],['MF',22,40],['MF',50,42],['MF',78,40],['FW',50,20]],
 '3-5-2':[['GK',50,90],['DF',28,74],['DF',50,77],['DF',72,74],['MF',12,54],['MF',34,52],['MF',50,57],['MF',66,52],['MF',88,54],['FW',38,26],['FW',62,26]],
 '3-4-3':[['GK',50,90],['DF',28,74],['DF',50,77],['DF',72,74],['MF',16,54],['MF',40,54],['MF',60,54],['MF',84,54],['FW',24,28],['FW',50,22],['FW',76,28]],
 '5-3-2':[['GK',50,90],['DF',12,70],['DF',31,76],['DF',50,79],['DF',69,76],['DF',88,70],['MF',30,52],['MF',50,55],['MF',70,52],['FW',38,28],['FW',62,28]],
};
const FORMNAMES=Object.keys(FORMATIONS);
const surname=n=>{const w=(n||'').trim().split(/\s+/);return w.length>1?w[w.length-1]:(w[0]||'');};
// "likely starter" score — uses enriched club minutes/apps when present, else caps + shirt heuristic
function strength(p){
  let s=0;
  if(Number.isFinite(p.club_minutes_2025_26)) s+=p.club_minutes_2025_26/90;
  else if(Number.isFinite(p.club_apps_2025_26)) s+=p.club_apps_2025_26;
  s+=(p.caps||0)*0.4 + (p.international_goals||0)*0.3;
  if(p.shirt_number) s+=Math.max(0,27-p.shirt_number)*0.25;   // low numbers ~ starters
  if(p.is_captain) s+=1e6;                                     // captain almost always starts
  return s;
}
function pickXI(sq,form){
  const slots=FORMATIONS[form], need={GK:0,DF:0,MF:0,FW:0};
  slots.forEach(s=>need[s[0]]++);
  const pools={GK:[],DF:[],MF:[],FW:[]};
  sq.forEach(p=>{if(pools[p.position])pools[p.position].push(p);});
  Object.values(pools).forEach(a=>a.sort((x,y)=>strength(y)-strength(x)));
  const chosen={GK:[],DF:[],MF:[],FW:[]},used=new Set();
  ['GK','DF','MF','FW'].forEach(c=>{chosen[c]=pools[c].slice(0,need[c]);chosen[c].forEach(p=>used.add(p.player_id));});
  const left=sq.filter(p=>!used.has(p.player_id)).sort((x,y)=>strength(y)-strength(x));
  ['GK','DF','MF','FW'].forEach(c=>{while(chosen[c].length<need[c]&&left.length){const p=left.shift();chosen[c].push(p);used.add(p.player_id);}});
  const idx={GK:0,DF:0,MF:0,FW:0};
  return slots.map(s=>{const c=s[0];const p=chosen[c][idx[c]++];return p?p.player_id:null;});
}
function autoForm(sq){ // pick formation matching squad shape (3-back if few DF, etc.)
  const df=sq.filter(p=>p.position==='DF').length, fw=sq.filter(p=>p.position==='FW').length;
  if(df<=7) return '3-4-3'; if(fw>=8) return '4-3-3'; if(fw<=5) return '4-2-3-1'; return '4-3-3';
}

let TP=null;
function teamDrawer(code){openTeamPage(code);}   // clicking a team anywhere -> full page
function openTeamPage(code){
  const t=DB.teams.find(x=>x.fifa_code===code);if(!t)return;
  const sq=DB.players.filter(p=>p.fifa_code===code);
  const form=autoForm(sq);
  TP={code,t,sq,sub:'lineup',form,xi:pickXI(sq,form),sel:null,msg:''};
  renderTeamPage();
}
function setSub(s){TP.sub=s;TP.sel=null;renderTeamPage();}
function setForm(f){TP.form=f;TP.xi=pickXI(TP.sq,f);TP.sel=null;TP.msg='';renderTeamPage();}
function resetXI(){TP.xi=pickXI(TP.sq,TP.form);TP.sel=null;TP.msg='Lineup reset to projection.';renderTeamPage();}
function pid2p(id){return TP.sq.find(p=>p.player_id===id);}
// click a bench card: select it. click a pitch slot: swap if same position, else open player.
function benchClick(id){TP.sel=(TP.sel===id?null:id);TP.msg=TP.sel?'Now tap a same-position player on the pitch to swap in.':'';renderTeamPage();}
function slotClick(i){
  const cur=TP.xi[i];
  if(TP.sel==null){ if(cur)playerDrawer(cur); return; }
  const inP=pid2p(TP.sel), slotCat=FORMATIONS[TP.form][i][0];
  if(inP.position!==slotCat){TP.msg=`${surname(inP.player_name)} is a ${inP.position} — pick a ${slotCat} slot.`;renderTeamPage();return;}
  const j=TP.xi.indexOf(TP.sel);            // if selected was already on pitch, swap the two
  TP.xi[i]=TP.sel; if(j>=0)TP.xi[j]=cur;
  TP.sel=null;TP.msg=`${surname(inP.player_name)} moved into the XI.`;renderTeamPage();
}

function renderTeamPage(){
  clearCharts();
  const {t,sq,form,xi}=TP;
  const ages=sq.map(p=>p.age).filter(Number.isFinite);
  const avg=ages.length?(ages.reduce((a,b)=>a+b,0)/ages.length).toFixed(1):'—';
  const subs=[['lineup','Lineup'],['squad','Squad'],['info','Team info']];
  let body='';
  if(TP.sub==='lineup') body=lineupHTML();
  else if(TP.sub==='squad') body=squadHTML();
  else body=infoHTML(avg);
  $('#view').innerHTML=`
   <button class="btn" onclick="route(currentTab)">← Back to ${currentTab}</button>
   <div class="panel" style="margin-top:14px">
     <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
       <div class="bigflag" style="background:${CONF[t.confederation]}">${t.fifa_code}</div>
       <div><div style="font-size:12px;color:var(--muted)">Group ${t.group_letter} · ${t.confederation} · ${esc(t.qualification_method)||''}</div>
         <h2 style="margin:2px 0">${esc(t.team_name)}</h2>
         <div class="sub">${esc(t.head_coach)||'—'} · ${t.fifa_ranking?'FIFA #'+t.fifa_ranking:''} · ${t.squad_size} players · avg age ${avg}</div></div>
     </div>
     <div class="subtabs">${subs.map(([k,l])=>`<span class="subtab ${TP.sub===k?'on':''}" onclick="setSub('${k}')">${l}</span>`).join('')}</div>
   </div>${body}`;
  if(TP.sub==='info'){ // mini chart of squad ages
    const buckets={};sq.forEach(p=>{const k=p.position;buckets[k]=(buckets[k]||0)+1;});
    doughnut('tpos',buckets,k=>POSC[k]||'#888');
  }
}
function tokenHTML(id,i){
  const cat=FORMATIONS[TP.form][i][0], p=id?pid2p(id):null;
  const [_,x,y]=FORMATIONS[TP.form][i];
  const selable=TP.sel!=null && p && pid2p(TP.sel) && pid2p(TP.sel).position===cat;
  return `<div class="token ${TP.xi[i]===TP.sel?'sel':''} ${selable?'drop':''}" style="left:${x}%;top:${y}%" onclick="slotClick(${i})">
    <div class="sh" style="background:${POSC[cat]}">${p?(p.shirt_number??''):''}${p&&p.is_captain?'<span class="cap">C</span>':''}</div>
    <div class="nm">${p?esc(surname(p.player_name)):'—'}</div></div>`;
}
function lineupHTML(){
  const onPitch=new Set(TP.xi.filter(Boolean));
  const bench=TP.sq.filter(p=>!onPitch.has(p.player_id)).sort((a,b)=>strength(b)-strength(a));
  const xiList=TP.xi.map(id=>id?pid2p(id):null);
  return `<div class="pitchwrap">
    <div class="panel"><h3>Projected XI <span class="tag">${TP.form} · auto-picked from squad data — not an official lineup</span></h3>
      <div class="formrow">${FORMNAMES.map(f=>`<span class="chip ${TP.form===f?'on':''}" onclick="setForm('${f}')">${f}</span>`).join('')}
        <span class="chip" onclick="resetXI()">↺ reset</span></div>

        <div class="line cc"></div><div class="line ch"></div>
        <div class="line box top"></div><div class="line box bot"></div>
        <div class="line six top"></div><div class="line six bot"></div>
        ${TP.xi.map((id,i)=>tokenHTML(id,i)).join('')}

    </div>
    <div class="panel"><h3>Bench <span class="tag">${bench.length} players · ranked by projected role</span></h3>
      <div class="benchlist">${bench.map(p=>benchCard(p)).join('')}</div>
    </div></div>`;
}
function benchCard(p){
  const sub=[p.club_apps_2025_26!=null?p.club_apps_2025_26+' apps':'',p.club_goals_2025_26!=null?p.club_goals_2025_26+'g':'',(p.caps||0)+' caps'].filter(Boolean).join(' · ');
  return `<div class="pcard ${TP.sel===p.player_id?'sel':''}" onclick="benchClick(${p.player_id})">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="pill poschip ${p.position}">${p.position}</span><span class="faint">#${p.shirt_number??'—'}</span></div>
    <div class="nm">${esc(p.player_name)}${p.is_captain?' ©':''}</div>
    <div class="meta">${esc(p.club)}</div><div class="meta faint">${sub}</div></div>`;
}

       <div class="statgrid">${stat('club_apps_2025_26','Apps')}${stat('club_starts_2025_26','Starts')}${stat('club_minutes_2025_26','Minutes')}${stat('club_goals_2025_26','Goals')}${stat('club_assists_2025_26','Assists')}${stat('club_yellow_2025_26','Yellow')}${stat('club_red_2025_26','Red')}${stat('club_clean_sheets_2025_26','Clean sheets')}${stat('club_goals_conceded_2025_26','Conceded')}</div>`:''}
     ${wl?`<div class="sec">Team record in his matches (2025/26)</div><div class="statgrid">${stat('team_wins_2025_26','Won')}${stat('team_draws_2025_26','Drew')}${stat('team_losses_2025_26','Lost')}</div>`:''}
     ${(p.career_club_apps!=null||p.career_club_goals!=null)?`<div class="sec">Club career totals</div><div class="statgrid">${stat('career_club_apps','Career apps')}${stat('career_club_goals','Career goals')}</div>`:''}
     ${p.form_note?`<div class="sec">Form note</div><div class="muted">${esc(p.form_note)}</div>`:''}
     ${srcs.length?`<div class="sec">Sources</div><div class="src">${srcs.map(s=>`<div><a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a></div>`).join('')}</div>`:''}
   </div>`);
}

/* ---------- helpers ---------- */
function cmp(s){return(a,b)=>{let x=a[s.k],y=b[s.k];const nx=x==null,ny=y==null;
  if(nx&&ny)return 0;if(nx)return 1;if(ny)return -1;
  if(typeof x==='string'&&typeof y==='string')return s.d*x.localeCompare(y);return s.d*((x>y)-(x<y));};}
function hookSort(v,state,draw){$$('th[data-k]',v).forEach(th=>th.onclick=()=>{const k=th.dataset.k;
  state.d=(state.k===k)?-state.d:(['player_name','team_name','club','fifa_code','group_letter'].includes(k)?1:-1);state.k=k;draw();});}
function markSort(sel,state){const tb=$(sel);if(!tb)return;const tbl=tb.closest('table');
  $$('th[data-k] .ar',tbl).forEach(a=>a.textContent='');
  const th=$(`th[data-k="${state.k}"] .ar`,tbl);if(th)th.textContent=state.d>0?'▲':'▼';}
function exportCSV(rows){const cols=DB.columns;
  const lines=[cols.join(',')].concat(rows.map(r=>cols.map(c=>{let v=r[c];if(v==null)v='';v=String(v);
    return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')));
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='wc2026_players_filtered.csv';a.click();}
function countUp(){$$('[data-cu]').forEach(el=>{const t=+el.dataset.cu;let s=0,step=Math.max(1,Math.ceil(t/40));
  const tick=()=>{s+=step;if(s>=t){el.textContent=num(t);}else{el.textContent=num(s);requestAnimationFrame(tick);}};tick();});}
function doughnut(id,obj,colorFn){const c=$('#'+id);if(!c)return;
  charts.push(new Chart(c,{type:'doughnut',data:{labels:Object.keys(obj),datasets:[{data:Object.values(obj),
    backgroundColor:Object.keys(obj).map(colorFn),borderColor:'#0a0e13',borderWidth:2}]},
    options:{plugins:{legend:{position:'right',labels:{color:'#8493a8',boxWidth:12,padding:8}}},cutout:'58%'}}));}
function barChart(id,obj,color,horizontal){const c=$('#'+id);if(!c)return;
  charts.push(new Chart(c,{type:'bar',data:{labels:Object.keys(obj),datasets:[{data:Object.values(obj),
    backgroundColor:color,borderRadius:5,maxBarThickness:26}]},
    options:{indexAxis:horizontal?'y':'x',plugins:{legend:{display:false},tooltip:{intersect:false}},
      scales:{x:{ticks:{color:'#8493a8',font:{size:10}},grid:{color:'#18222f'}},
        y:{ticks:{color:'#8493a8',font:{size:10}},grid:{color:'#18222f'}}}}}));}
</script>
