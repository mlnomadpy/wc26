<!doctype html><html><head><meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>:root{--bg:#050a16;--bg1:#0a1326;--bg2:#0f1f3e;--bg3:#173058;--line:#1b3260;--line2:#2c4d8c;--fg:#e9f2ff;--fg-dim:#90a6d0;--fg-mute:#5e7099;--accent:#2b8cff;--accent2:#56e0ff;--gold:#ffd23d;--magenta:#ff3d8b;--fdisp:'Bricolage Grotesque',sans-serif;--fdisp2:'Saira Condensed',sans-serif;--fmono:'IBM Plex Mono',monospace;--on-accent:#04122b;--sh:0 16px 44px -14px rgba(0,0,0,.78)}
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(900px 500px at 50% -10%,rgba(43,140,255,.14),transparent 60%),var(--bg);font-family:var(--fdisp);min-height:100vh;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;padding:34px}
  .lbl{color:var(--accent2);font-family:var(--fmono);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .row{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  a.fut{text-decoration:none}
  /* ===== VARIANT: minimal-electric ===== */
  /* ============================================================
   VOLT EDGE — minimal-electric Blue Lock player card
   Self-contained. Targets the fixed HTML only.
   ============================================================ */

.fut{
  --c1:var(--accent);
  --c2:var(--accent2);
  --chamfer:18px;
  position:relative;
  display:flex;
  flex-direction:column;
  box-sizing:border-box;
  aspect-ratio:5/7;
  padding:16px 15px 14px;
  text-decoration:none;
  color:var(--fg);
  font-family:var(--fdisp);
  background:
    radial-gradient(120% 90% at 78% -10%, color-mix(in srgb,var(--c1) 14%,transparent), transparent 55%),
    linear-gradient(168deg,var(--bg2) 0%,var(--bg1) 46%,var(--bg) 100%);
  /* soft chamfer on TL + BR only — precision HUD plate */
  clip-path:polygon(
    var(--chamfer) 0, 100% 0,
    100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%,
    0 100%, 0 var(--chamfer));
  isolation:isolate;
  transition:transform .45s cubic-bezier(.2,.7,.2,1), filter .45s ease;
  will-change:transform;
}
.fut:hover{ transform:translateY(-6px); filter:brightness(1.05); }

/* ---- the single animated glowing edge line ---- */
.fut::before{
  content:"";
  position:absolute; inset:0;
  z-index:0; pointer-events:none;
  padding:1.4px;
  clip-path:polygon(
    var(--chamfer) 0, 100% 0,
    100% calc(100% - var(--chamfer)), calc(100% - var(--chamfer)) 100%,
    0 100%, 0 var(--chamfer));
  background:
    conic-gradient(from var(--beam,0deg),
      transparent 0deg,
      color-mix(in srgb,var(--c2) 25%,transparent) 40deg,
      var(--c2) 72deg,
      color-mix(in srgb,var(--c1) 90%,#fff) 80deg,
      var(--c2) 88deg,
      transparent 130deg,
      transparent 360deg),
    linear-gradient(180deg,
      color-mix(in srgb,var(--line2) 70%,transparent),
      color-mix(in srgb,var(--line) 60%,transparent));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  animation:fut-beam 5.5s linear infinite;
}
@property --beam{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
@keyframes fut-beam{ to{ --beam:360deg; } }

/* faint inner ambient glow hugging the edge */
.fut::after{
  content:"";
  position:absolute; inset:0; z-index:0; pointer-events:none;
  clip-path:inherit;
  box-shadow:inset 0 0 22px -10px color-mix(in srgb,var(--c1) 60%,transparent);
}

/* optional foil/scanline overlay (kept whisper-light for minimalism) */
.fut-sheen{
  position:absolute; inset:0; z-index:4; pointer-events:none;
  clip-path:inherit; opacity:.5;
  background:
    repeating-linear-gradient(0deg,
      transparent 0 3px,
      color-mix(in srgb,var(--c2) 5%,transparent) 3px 4px);
  mix-blend-mode:screen;
  transition:opacity .4s ease;
}
.fut:hover .fut-sheen{ opacity:.85; }

/* ============================= HERO ============================= */
.fut-hero{
  position:relative;
  flex:1; min-height:0;
  display:flex; align-items:center; justify-content:center;
  width:100%;
  z-index:1;
  overflow:hidden;
}

/* ghosted oversized monogram = intentional focal graphic */
.fut-mono{
  font-family:var(--fdisp2);
  font-size:104px;
  font-weight:800;
  line-height:.8;
  letter-spacing:-.02em;
  color:transparent;
  -webkit-text-stroke:1.2px color-mix(in srgb,var(--c2) 38%,transparent);
  text-shadow:0 0 34px color-mix(in srgb,var(--c1) 28%,transparent);
  opacity:.85;
  user-select:none;
  transform:translateX(8px);
  transition:transform .5s cubic-bezier(.2,.7,.2,1), -webkit-text-stroke-color .4s ease;
}
.fut:hover .fut-mono{ transform:translateX(8px) scale(1.04); }

/* player photo (when present) sits above the monogram */
.fut-img{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  object-position:top center;
  z-index:2;
}

/* ============================= LEFT RAIL ============================= */
.fut-rail{
  position:absolute; top:0; left:0; bottom:0;
  z-index:3;
  display:flex; flex-direction:column; align-items:center;
  gap:9px;
  padding:2px 10px 2px 0;
}
/* the single cyan accent stripe */
.fut-rail::before{
  content:"";
  position:absolute; left:-3px; top:2px; bottom:2px;
  width:2px;
  background:linear-gradient(180deg,
    var(--c2),
    color-mix(in srgb,var(--c1) 80%,transparent) 55%,
    transparent);
  box-shadow:0 0 8px color-mix(in srgb,var(--c2) 70%,transparent);
}

.fut-ovr{ display:flex; flex-direction:column; align-items:center; line-height:.82; }
.fut-ovr b{
  font-family:var(--fdisp2);
  font-size:34px; font-weight:800;
  color:var(--fg);
  text-shadow:0 0 16px color-mix(in srgb,var(--c1) 45%,transparent);
}
.fut-ovr span{
  font-family:var(--fmono);
  font-size:9px; font-weight:600;
  letter-spacing:.18em;
  color:var(--c2);
  margin-top:2px;
}

.fut-rdiv{
  width:18px; height:1px;
  background:linear-gradient(90deg,transparent,var(--line2),transparent);
}

.flagi{
  width:20px; height:auto;
  border-radius:2px;
  box-shadow:0 0 0 1px var(--line), 0 1px 4px rgba(0,0,0,.4);
}

.fut-num{
  font-family:var(--fmono);
  font-size:10px; font-weight:700;
  color:var(--fg-dim);
  letter-spacing:.05em;
}

.fut-cap{
  font-family:var(--fdisp);
  font-size:8px; font-weight:800;
  width:15px; height:15px;
  display:flex; align-items:center; justify-content:center;
  color:var(--bg);
  background:var(--c2);
  border-radius:3px;
  box-shadow:0 0 8px color-mix(in srgb,var(--c2) 60%,transparent);
}

/* ============================= NAME ============================= */
.fut-name{
  z-index:3;
  width:100%;
  margin-top:11px;
  padding-top:9px;
  font-family:var(--fdisp);
  font-weight:800;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:.01em;
  line-height:1.05;
  text-align:left;
  color:var(--fg);
  border-top:1px solid color-mix(in srgb,var(--line2) 60%,transparent);
}

/* ============================= STATS ============================= */
.fut-stats{
  z-index:3;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px 14px;
  width:100%;
  margin-top:9px;
}
.fut-stats span{
  display:flex; align-items:baseline; gap:6px;
}
.fut-stats b{
  font-family:var(--fdisp2);
  font-size:15px; font-weight:800;
  font-variant-numeric:tabular-nums;
  min-width:20px;
  color:var(--fg);
}
.fut-stats i{
  font-family:var(--fmono);
  font-style:normal;
  font-size:8.5px; font-weight:600;
  letter-spacing:.12em;
  color:var(--fg-mute);
  text-transform:uppercase;
}

/* ============================= BADGE ============================= */
.fut-badge{
  position:absolute;
  top:14px; right:14px;
  z-index:5;
  font-family:var(--fmono);
  font-size:8px; font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  padding:4px 8px;
  color:var(--c2);
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  backdrop-filter:blur(4px);
  border:1px solid color-mix(in srgb,var(--c2) 45%,transparent);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}

/* ============================= BIG SIZE ============================= */
.fut.big{ width:264px; max-width:100%; padding:20px 18px 16px; --chamfer:22px; }
.fut.big .fut-ovr b{ font-size:44px; }
.fut.big .fut-mono{ font-size:132px; }
.fut.big .fut-name{ font-size:18px; }
.fut.big .fut-stats b{ font-size:17px; }
.fut.big .fut-stats i{ font-size:9.5px; }
.fut.big .flagi{ width:24px; }

/* ============================================================
   TIER VARIANTS
   ============================================================ */

/* GOLD — warm electric, cyan beam tinted gold */
.fut.gold{ --c1:var(--gold); --c2:var(--gold2); }
.fut.gold .fut-ovr span,
.fut.gold .fut-mono{ color:transparent; }
.fut.gold .fut-mono{ -webkit-text-stroke-color:color-mix(in srgb,var(--gold) 42%,transparent); }
.fut.gold .fut-cap{ color:var(--bg); }

/* SILVER — desaturated steel, restrained */
.fut.silver{ --c1:#9fb3cf; --c2:#cfe0f2; }
.fut.silver .fut-ovr b{ text-shadow:0 0 14px color-mix(in srgb,#cfe0f2 35%,transparent); }
.fut.silver .fut-mono{ -webkit-text-stroke-color:color-mix(in srgb,#cfe0f2 30%,transparent); opacity:.6; }

/* BRONZE — muted ember */
.fut.bronze{ --c1:#d08a4e; --c2:#f0b079; }
.fut.bronze .fut-mono{ opacity:.6; }

/* SPECIAL — peak electric cyan superstar */
.fut.special{ --c1:var(--accent); --c2:var(--accent2); }
.fut.special{
  background:
    radial-gradient(130% 95% at 80% -12%, color-mix(in srgb,var(--accent) 22%,transparent), transparent 58%),
    linear-gradient(168deg,#0f2748 0%,var(--bg1) 48%,var(--bg) 100%);
}
.fut.special::before{ animation-duration:3.6s; padding:1.8px; }
.fut.special .fut-ovr b{ color:var(--accent2); text-shadow:0 0 22px color-mix(in srgb,var(--accent2) 60%,transparent); }
.fut.special .fut-name{ color:var(--accent2); }
.fut.special .fut-mono{
  -webkit-text-stroke-color:color-mix(in srgb,var(--accent2) 55%,transparent);
  text-shadow:0 0 40px color-mix(in srgb,var(--accent) 45%,transparent);
  opacity:1;
}

/* LEGEND — regal gold, slower stately beam */
.fut.legend{ --c1:var(--gold); --c2:var(--gold2); }
.fut.legend{
  background:
    radial-gradient(130% 95% at 80% -12%, color-mix(in srgb,var(--gold) 20%,transparent), transparent 58%),
    linear-gradient(168deg,#1c2238 0%,#0b1124 50%,var(--bg) 100%);
}
.fut.legend::before{ animation-duration:7s; }
.fut.legend .fut-ovr b{ color:var(--gold2); text-shadow:0 0 20px color-mix(in srgb,var(--gold) 55%,transparent); }
.fut.legend .fut-name{ color:var(--gold2); }
.fut.legend .fut-mono{ -webkit-text-stroke-color:color-mix(in srgb,var(--gold2) 50%,transparent); opacity:.9; }
.fut.legend .fut-cap{ color:#2b1f04; }

/* RISING — magenta-cyan gradient youth energy */
.fut.rising{ --c1:var(--magenta); --c2:var(--accent2); }
.fut.rising .fut-ovr b{ text-shadow:0 0 18px color-mix(in srgb,var(--magenta) 45%,transparent); }
.fut.rising .fut-mono{ -webkit-text-stroke:1.2px transparent; background:linear-gradient(150deg,var(--accent2),var(--magenta)); -webkit-background-clip:text; background-clip:text; opacity:.7; }

/* reduced-motion: kill the beam, keep a static lit edge */
@media (prefers-reduced-motion:reduce){
  .fut::before{ animation:none; background:linear-gradient(180deg,var(--c2),var(--line)); opacity:.7; }
  .fut:hover{ transform:none; }
}
