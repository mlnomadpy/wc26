  <style>:root{--bg:#050a16;--bg1:#0a1326;--bg2:#0f1f3e;--bg3:#173058;--line:#1b3260;--line2:#2c4d8c;--fg:#e9f2ff;--fg-dim:#90a6d0;--fg-mute:#5e7099;--accent:#2b8cff;--accent2:#56e0ff;--gold:#ffd23d;--magenta:#ff3d8b;--fdisp:'Bricolage Grotesque',sans-serif;--fdisp2:'Saira Condensed',sans-serif;--fmono:'IBM Plex Mono',monospace;--on-accent:#04122b;--sh:0 16px 44px -14px rgba(0,0,0,.78)}
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(900px 500px at 50% -10%,rgba(43,140,255,.14),transparent 60%),var(--bg);font-family:var(--fdisp);min-height:100vh;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;padding:34px}
  .lbl{color:var(--accent2);font-family:var(--fmono);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .row{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  a.fut{text-decoration:none}
  /* ===== VARIANT: holo-id ===== */
  /* ============================================================
   HOLO-ID — Blue Lock holographic ID-badge card (self-contained)
   ============================================================ */

/* keyframes ------------------------------------------------- */
@keyframes holoBeam   { to { --beam: 360deg; } }
@keyframes holoFoil   { 0%{background-position:0% 50%,0 0}
                        100%{background-position:200% 50%,0 0} }
@keyframes holoScan   { 0%{transform:translateY(-30%)} 100%{transform:translateY(130%)} }
@keyframes holoPulse  { 0%,100%{opacity:.55} 50%{opacity:1} }
@property --beam { syntax:'<angle>'; inherits:false; initial-value:0deg; }

/* ---- ROOT --------------------------------------------------
   chamfered ID-badge silhouette: clean diagonal cut top-right. */
.fut{
  /* tier defaults (overridden per variant) */
  --c1:#2b8cff; --c2:#56e0ff; --ct:#eaf4ff; --metal:#0f1f3e;
  --frame:color-mix(in srgb,var(--accent) 60%,transparent);
  position:relative; display:flex; flex-direction:column; isolation:isolate;
  aspect-ratio:5/7; width:100%; padding:14px 13px 13px;
  color:var(--fg); text-decoration:none; overflow:hidden;
  font-family:var(--fdisp,'Bricolage Grotesque',system-ui,sans-serif);
  background:
    linear-gradient(157deg,#0c1a35 0%,#081328 46%,#0a1a3a 100%);
  /* angular badge: notch top-right + clipped bottom-left */
  clip-path:polygon(
    0 0, calc(100% - 34px) 0, 100% 34px,
    100% 100%, 26px 100%, 0 calc(100% - 26px)
  );
  box-shadow:0 16px 40px -16px rgba(3,10,28,.9);
  transition:transform .25s cubic-bezier(.22,.61,.36,1),
             filter .25s ease;
}
.fut:hover{ transform:translateY(-6px); filter:saturate(1.15); }

/* rotating conic energy beam (the glowing frame) */
.fut::before{
  content:""; position:absolute; inset:-40%; z-index:0; pointer-events:none;
  background:conic-gradient(from var(--beam),
    transparent 0deg,
    var(--c1) 60deg,
    var(--c2) 120deg,
    transparent 175deg,
    transparent 195deg,
    var(--c2) 250deg,
    var(--c1) 310deg,
    transparent 360deg);
  animation:holoBeam 5.5s linear infinite;
  opacity:.95;
}
/* glass inner panel — masks the beam down to a thin frame band */
.fut::after{
  content:""; position:absolute; inset:1.6px; z-index:0; pointer-events:none;
  clip-path:polygon(
    0 0, calc(100% - 33px) 0, 100% 33px,
    100% 100%, 25px 100%, 0 calc(100% - 25px)
  );
  background:
    radial-gradient(120% 80% at 18% 0%,
      color-mix(in srgb,var(--c1) 16%,transparent) 0%,transparent 55%),
    linear-gradient(157deg,#0c1c3a 0%,#070f24 52%,#0a1838 100%);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c2) 22%,transparent),
             inset 0 0 26px -6px rgba(0,0,0,.85);
}

/* corner accent ticks (HUD framing) */
.fut .fut-hero::before,
.fut .fut-hero::after{
  content:""; position:absolute; width:13px; height:13px; z-index:4;
  pointer-events:none; opacity:.8;
  border-color:color-mix(in srgb,var(--c2) 80%,transparent);
}
.fut .fut-hero::before{ left:0; top:0; border-left:2px solid; border-top:2px solid; }
.fut .fut-hero::after{ right:0; top:0; border-right:2px solid; border-top:2px solid; }

/* ---- SHEEN: holographic foil + scanlines ------------------ */
.fut-sheen{
  position:absolute; inset:0; z-index:5; pointer-events:none; overflow:hidden;
  clip-path:polygon(0 0, calc(100% - 34px) 0, 100% 34px,
                    100% 100%, 26px 100%, 0 calc(100% - 26px));
  background:
    linear-gradient(115deg,
      transparent 32%,
      rgba(86,224,255,.10) 44%,
      rgba(255,61,139,.10) 50%,
      rgba(43,140,255,.12) 56%,
      transparent 68%),
    repeating-linear-gradient(0deg,
      rgba(150,210,255,.05) 0 1px, transparent 1px 3px);
  background-size:200% 100%, 100% 100%;
  mix-blend-mode:screen;
  opacity:.6;
  animation:holoFoil 7s linear infinite;
}
/* sweeping scanline highlight */
.fut-sheen::after{
  content:""; position:absolute; left:0; right:0; height:34%;
  background:linear-gradient(180deg,transparent,
    rgba(140,220,255,.16) 50%,transparent);
  animation:holoScan 4.5s ease-in-out infinite;
  mix-blend-mode:screen;
}
.fut:hover .fut-sheen{ opacity:.92; }

/* ---- HERO (portrait area) --------------------------------- */
.fut-hero{
  position:relative; flex:1; min-height:0; z-index:2;
  display:flex; align-items:center; justify-content:center;
  margin:2px 0 0;
}
/* player photo (when present) */
.fut-img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:50% 12%; z-index:1;
  -webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);
          mask-image:linear-gradient(180deg,#000 70%,transparent);
}
.fut-img[src=""], .fut-img:not([src]){ display:none; }

/* ---- MONOGRAM: huge ghosted focal HUD graphic ------------- */
.fut-mono{
  position:relative; z-index:1;
  font-family:var(--fdisp2,'Saira Condensed',system-ui,sans-serif);
  font-weight:800; font-style:italic; letter-spacing:-.04em;
  font-size:84px; line-height:.8;
  color:transparent;
  background:linear-gradient(180deg,
    color-mix(in srgb,var(--c2) 60%,#fff 8%),
    color-mix(in srgb,var(--c1) 70%,transparent) 60%,
    transparent 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-stroke:1.5px color-mix(in srgb,var(--c2) 35%,transparent);
  opacity:.85;
  text-shadow:0 0 30px color-mix(in srgb,var(--c1) 45%,transparent);
  filter:drop-shadow(0 0 12px color-mix(in srgb,var(--c2) 30%,transparent));
}
/* ghost echo of the monogram behind everything */
.fut-mono::after{
  content:attr(data-m); /* harmless if empty — decorative scale only */
  position:absolute; inset:0; z-index:-1;
}

/* ---- RAIL: left vertical HUD stack ------------------------ */
.fut-rail{
  position:absolute; left:-2px; top:0; bottom:0; z-index:3;
  display:flex; flex-direction:column; align-items:center; gap:7px;
  padding:2px 6px 2px 2px;
}
/* rating + position tab — angled, glowing, seated under the cut */
.fut-ovr{
  display:flex; flex-direction:column; align-items:center; line-height:.82;
  padding:7px 9px 6px; margin-bottom:1px;
  background:linear-gradient(155deg,
    color-mix(in srgb,var(--c1) 30%,#06122a),
    #06112600 120%);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),50% 100%,0 calc(100% - 9px));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c2) 45%,transparent),
             0 0 18px -6px var(--c1);
}
.fut-ovr b{
  font-family:var(--fdisp2,'Saira Condensed',system-ui,sans-serif);
  font-weight:800; font-size:28px; letter-spacing:-.02em;
  color:#fff;
  text-shadow:0 0 14px color-mix(in srgb,var(--c2) 70%,transparent);
}
.fut-ovr span{
  font-family:var(--fmono,'IBM Plex Mono',monospace);
  font-size:9px; font-weight:700; letter-spacing:.18em;
  text-transform:uppercase;
  color:color-mix(in srgb,var(--c2) 75%,var(--fg));
}
/* divider */
.fut-rdiv{
  width:18px; height:2px;
  background:linear-gradient(90deg,transparent,var(--c2),transparent);
  box-shadow:0 0 8px var(--c2);
}
/* nation flag */
.flagi{
  width:24px; height:auto; display:block; border-radius:2px;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c2) 55%,#0006),
             0 0 10px -2px var(--c1);
  clip-path:polygon(0 0,100% 0,100% 70%,80% 100%,0 100%);
}
/* shirt number */
.fut-num{
  font-family:var(--fdisp2,'Saira Condensed',system-ui,sans-serif);
  font-weight:800; font-size:13px; letter-spacing:.02em;
  color:var(--fg-dim,#90a6d0);
}
/* captain mark */
.fut-cap{
  font-family:var(--fdisp,'Bricolage Grotesque',sans-serif);
  font-weight:800; font-size:9px; line-height:1;
  width:16px; height:16px; display:flex; align-items:center; justify-content:center;
  color:#06122a;
  background:linear-gradient(150deg,var(--c2),var(--c1));
  clip-path:polygon(50% 0,100% 28%,100% 78%,50% 100%,0 78%,0 28%);
  box-shadow:0 0 10px -2px var(--c2);
}

/* ---- NAME ------------------------------------------------- */
.fut-name{
  position:relative; z-index:3;
  font-family:var(--fdisp,'Bricolage Grotesque',sans-serif);
  font-weight:800; font-style:italic; text-transform:uppercase;
  font-size:13px; letter-spacing:.01em; line-height:1.02;
  text-align:center; width:100%;
  margin:6px 0 6px; padding-top:7px;
  color:var(--fg,#e9f2ff);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  border-top:1px solid color-mix(in srgb,var(--c2) 30%,transparent);
  text-shadow:0 0 16px color-mix(in srgb,var(--c1) 45%,transparent);
}

/* ---- STATS: 2x3 HUD grid ---------------------------------- */
.fut-stats{
  position:relative; z-index:3;
  display:grid; grid-template-columns:repeat(3,1fr);
  grid-auto-rows:1fr; gap:5px 6px; width:100%;
}
.fut-stats span{
  display:flex; flex-direction:column; align-items:center; gap:1px;
  padding:4px 2px;
  background:color-mix(in srgb,var(--c1) 8%,#0006);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c2) 16%,transparent);
}
.fut-stats b{
  font-family:var(--fdisp2,'Saira Condensed',system-ui,sans-serif);
  font-weight:800; font-size:15px; line-height:1;
  font-variant-numeric:tabular-nums;
  color:#fff;
}
.fut-stats i{
  font-family:var(--fmono,'IBM Plex Mono',monospace);
  font-style:normal; font-size:7.5px; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--fg-mute,#5e7099);
}

/* ---- BADGE (special/legend) ------------------------------- */
.fut-badge{
  position:absolute; top:9px; right:-3px; z-index:6;
  font-family:var(--fmono,'IBM Plex Mono',monospace);
  font-size:8px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase;
  padding:4px 18px 4px 10px; color:#06122a;
  background:linear-gradient(100deg,var(--c2),var(--c1));
  clip-path:polygon(8px 0,100% 0,100% 100%,0 100%);
  box-shadow:0 0 16px -4px var(--c2);
  animation:holoPulse 2.6s ease-in-out infinite;
}

/* ============================================================
   TIER VARIANTS
   ============================================================ */

/* GOLD — electric gold over navy */
.fut.gold{
  --c1:var(--gold,#ffd23d); --c2:#ffe98a;
  --frame:color-mix(in srgb,var(--gold) 70%,transparent);
}

/* SILVER — cool chrome */
.fut.silver{
  --c1:#aebfd6; --c2:#e6eef9;
}

/* BRONZE — warm copper */
.fut.bronze{
  --c1:#d08a4e; --c2:#f0b483;
}

/* SPECIAL — electric cyan superstar (the signature look) */
.fut.special{
  --c1:var(--accent,#2b8cff); --c2:var(--accent2,#56e0ff);
}
.fut.special::before{ animation-duration:3.8s; }
.fut.special .fut-mono{ opacity:.95; }
.fut.special .fut-name{ color:var(--accent2,#56e0ff); }

/* LEGEND — regal gold + magenta holo */
.fut.legend{
  --c1:var(--gold,#ffd23d); --c2:#fff2c2;
}
.fut.legend::before{
  background:conic-gradient(from var(--beam),
    transparent 0deg, var(--gold) 55deg, #fff2c2 110deg,
    var(--magenta,#ff3d8b) 150deg, transparent 185deg,
    transparent 205deg, #fff2c2 260deg, var(--gold) 320deg, transparent 360deg);
  animation-duration:4.5s;
}
.fut.legend .fut-mono{
  background:linear-gradient(180deg,#fff2c2,
    color-mix(in srgb,var(--gold) 80%,transparent) 60%,transparent);
  -webkit-background-clip:text; background-clip:text;
}
.fut.legend .fut-name{ color:#ffe98a; }

/* RISING — cyan→violet gradient energy */
.fut.rising{
  --c1:var(--accent2,#56e0ff); --c2:#9d7cff;
}
.fut.rising::before{
  background:conic-gradient(from var(--beam),
    transparent 0deg, var(--accent2,#56e0ff) 70deg, #9d7cff 140deg,
    transparent 185deg, transparent 205deg, #9d7cff 270deg,
    var(--accent2,#56e0ff) 330deg, transparent 360deg);
}

/* ---- SIZE: .big ------------------------------------------- */
.fut.big{ width:264px; max-width:100%; padding:16px 15px 15px; }
.fut.big .fut-mono{ font-size:104px; }
.fut.big .fut-ovr b{ font-size:34px; }
.fut.big .fut-name{ font-size:16px; }
.fut.big .fut-stats b{ font-size:18px; }
.fut.big .fut-stats i{ font-size:8.5px; }
.fut.big .flagi{ width:28px; }

/* reduced motion */
@media (prefers-reduced-motion:reduce){
  .fut::before,.fut-sheen,.fut-sheen::after,.fut-badge{ animation:none; }
}
