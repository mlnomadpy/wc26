<!doctype html><html><head><meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Saira+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>:root{--bg:#050a16;--bg1:#0a1326;--bg2:#0f1f3e;--bg3:#173058;--line:#1b3260;--line2:#2c4d8c;--fg:#e9f2ff;--fg-dim:#90a6d0;--fg-mute:#5e7099;--accent:#2b8cff;--accent2:#56e0ff;--gold:#ffd23d;--magenta:#ff3d8b;--fdisp:'Bricolage Grotesque',sans-serif;--fdisp2:'Saira Condensed',sans-serif;--fmono:'IBM Plex Mono',monospace;--on-accent:#04122b;--sh:0 16px 44px -14px rgba(0,0,0,.78)}
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(900px 500px at 50% -10%,rgba(43,140,255,.14),transparent 60%),var(--bg);font-family:var(--fdisp);min-height:100vh;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;padding:34px}
  .lbl{color:var(--accent2);font-family:var(--fmono);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .row{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
  a.fut{text-decoration:none}
  /* ===== VARIANT: hud-tactical ===== */
  /* ============================================================
   BLUE LOCK — HUD TACTICAL READOUT CARD
   Self-contained stylesheet. Targets the fixed .fut markup only.
   ============================================================ */

/* ---- root card ---- */
.fut{
  --c1:var(--accent);          /* primary energy */
  --c2:var(--accent2);         /* cyan highlight */
  --frame:color-mix(in srgb,var(--accent2) 70%,transparent);
  --plate:linear-gradient(157deg,var(--bg2) 0%,var(--bg1) 46%,var(--bg) 100%);
  --notch:18px;
  position:relative;
  display:flex;
  flex-direction:column;
  aspect-ratio:5/7;
  width:148px;
  max-width:100%;
  padding:13px 13px 12px;
  color:var(--fg);
  text-decoration:none;
  font-family:var(--fdisp,'Bricolage Grotesque',system-ui,sans-serif);
  background:var(--plate);
  /* chamfer top-left + bottom-right */
  clip-path:polygon(
    var(--notch) 0,
    100% 0,
    100% calc(100% - var(--notch)),
    calc(100% - var(--notch)) 100%,
    0 100%,
    0 var(--notch)
  );
  isolation:isolate;
  transition:transform .25s cubic-bezier(.2,.7,.3,1),filter .25s ease;
  -webkit-tap-highlight-color:transparent;
}
.fut.big{ width:264px; padding:18px 17px 16px; --notch:26px; }

/* ---- glowing HUD frame (drawn as a clipped border layer) ---- */
.fut::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:4;
  pointer-events:none;
  padding:1.5px;
  background:linear-gradient(157deg,
      var(--frame) 0%,
      color-mix(in srgb,var(--accent) 60%,transparent) 38%,
      transparent 55%,
      var(--frame) 100%);
  clip-path:polygon(
    var(--notch) 0,100% 0,
    100% calc(100% - var(--notch)),
    calc(100% - var(--notch)) 100%,
    0 100%,0 var(--notch)
  );
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask-composite:exclude;
  filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent2) 45%,transparent));
}

/* outer ambient glow + base shadow */
.fut{
  box-shadow:
    0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent),
    0 14px 34px -16px rgba(0,0,0,.85),
    0 0 26px -14px color-mix(in srgb,var(--accent2) 80%,transparent);
}
.fut:hover{
  transform:translateY(-6px);
  filter:saturate(1.08);
}
.fut:hover::before{
  filter:drop-shadow(0 0 9px color-mix(in srgb,var(--accent2) 70%,transparent));
}
.fut:focus-visible{ outline:2px solid var(--accent2); outline-offset:3px; }

/* ---- corner bracket ticks (targeting overlay) ---- */
.fut::after{
  content:"";
  position:absolute;
  z-index:5;
  pointer-events:none;
  top:7px; right:7px;
  width:16px; height:16px;
  border-top:1.5px solid var(--accent2);
  border-right:1.5px solid var(--accent2);
  opacity:.9;
  filter:drop-shadow(0 0 3px var(--accent2));
}
.fut.big::after{ top:11px; right:11px; width:22px; height:22px; }

/* mirror bracket on the bottom-left via the hero (kept lightweight) */

/* ============================================================
   HERO / PORTRAIT AREA
   ============================================================ */
.fut-hero{
  position:relative;
  flex:1 1 auto;
  min-height:0;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid color-mix(in srgb,var(--line2) 90%,transparent);
  background:
    radial-gradient(120% 80% at 70% 8%,color-mix(in srgb,var(--accent) 26%,transparent) 0%,transparent 55%),
    radial-gradient(90% 70% at 18% 100%,color-mix(in srgb,var(--accent2) 16%,transparent) 0%,transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg));
  clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px));
}

/* bottom-left corner bracket inside the hero */
.fut-hero::after{
  content:"";
  position:absolute;
  left:6px; bottom:6px;
  width:14px; height:14px;
  border-left:1.5px solid var(--accent2);
  border-bottom:1.5px solid var(--accent2);
  opacity:.85;
  filter:drop-shadow(0 0 3px var(--accent2));
  z-index:4;
}

/* drifting scanlines over the hero */
.fut-hero::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:
    repeating-linear-gradient(0deg,
      transparent 0 3px,
      color-mix(in srgb,var(--accent2) 9%,transparent) 3px 4px);
  mix-blend-mode:screen;
  opacity:.55;
  animation:hud-scan 6s linear infinite;
}
@keyframes hud-scan{ to{ background-position:0 16px; } }

/* ---- ghosted monogram (focal placeholder graphic) ---- */
.fut-mono{
  position:relative;
  z-index:1;
  font-family:var(--fdisp2,'Saira Condensed',system-ui,sans-serif);
  font-weight:800;
  font-size:62px;
  line-height:.8;
  letter-spacing:-.02em;
  color:transparent;
  -webkit-text-stroke:1.4px color-mix(in srgb,var(--accent2) 55%,transparent);
  background:linear-gradient(180deg,
      color-mix(in srgb,var(--accent2) 30%,transparent),
      color-mix(in srgb,var(--accent) 8%,transparent));
  -webkit-background-clip:text;
          background-clip:text;
  text-shadow:0 0 22px color-mix(in srgb,var(--accent) 40%,transparent);
  filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent2) 30%,transparent));
  transform:translateY(-2px);
  user-select:none;
}
.fut.big .fut-mono{ font-size:104px; }

/* ---- player photo (when present) sits above the monogram ---- */
.fut-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:top center;
  z-index:1;
}

/* ============================================================
   LEFT VERTICAL RAIL (rating / nation / number / captain)
   ============================================================ */
.fut-rail{
  position:absolute;
  top:8px; left:8px;
  z-index:3;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  padding:6px 5px 7px;
  background:linear-gradient(180deg,
      color-mix(in srgb,var(--bg) 72%,transparent),
      color-mix(in srgb,var(--bg1) 60%,transparent));
  border:1px solid color-mix(in srgb,var(--accent2) 30%,transparent);
  backdrop-filter:blur(3px);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);
}
.fut.big .fut-rail{ top:11px; left:11px; gap:9px; padding:8px 7px 9px; }

/* rating as an angular notched badge */
.fut-ovr{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:.82;
  padding:5px 7px 4px;
  background:linear-gradient(155deg,
      color-mix(in srgb,var(--accent) 26%,var(--bg2)),
      var(--bg1));
  border:1px solid color-mix(in srgb,var(--accent2) 55%,transparent);
  clip-path:polygon(0 0,100% 0,100% 70%,72% 100%,0 100%);
  box-shadow:0 0 12px -4px color-mix(in srgb,var(--accent) 70%,transparent);
}
.fut-ovr b{
  font-family:var(--fdisp2,'Saira Condensed',system-ui,sans-serif);
  font-weight:800;
  font-size:28px;
  color:var(--fg);
  text-shadow:0 0 10px color-mix(in srgb,var(--accent2) 60%,transparent);
}
.fut-ovr span{
  font-family:var(--fmono,'IBM Plex Mono',monospace);
  font-weight:700;
  font-size:9.5px;
  letter-spacing:.12em;
  color:var(--accent2);
}
.fut.big .fut-ovr b{ font-size:40px; }
.fut.big .fut-ovr span{ font-size:11px; }

/* rail divider — a glowing tick line */
.fut-rdiv{
  width:18px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--accent2),transparent);
  box-shadow:0 0 6px color-mix(in srgb,var(--accent2) 70%,transparent);
  opacity:.8;
}
.fut.big .fut-rdiv{ width:24px; }

/* nation flag */
.flagi{
  width:22px;
  height:auto;
  display:block;
  border:1px solid color-mix(in srgb,var(--accent2) 40%,transparent);
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 8px -3px var(--accent2);
}
.fut.big .flagi{ width:30px; }

/* squad number — mono HUD readout */
.fut-num{
  font-family:var(--fmono,'IBM Plex Mono',monospace);
  font-weight:700;
  font-size:10px;
  letter-spacing:.06em;
  color:var(--fg-dim);
}
.fut.big .fut-num{ font-size:12px; }

/* captain marker */
.fut-cap{
  display:flex;
  align-items:center;
  justify-content:center;
  width:16px; height:16px;
  font-family:var(--fdisp2,'Saira Condensed',system-ui,sans-serif);
  font-weight:800;
  font-size:10px;
  color:var(--bg);
  background:var(--accent2);
  box-shadow:0 0 10px -2px var(--accent2);
  clip-path:polygon(50% 0,100% 28%,100% 72%,50% 100%,0 72%,0 28%);
}
.fut.big .fut-cap{ width:20px; height:20px; font-size:12px; }

/* ============================================================
   NAME PLATE
   ============================================================ */
.fut-name{
  position:relative;
  width:100%;
  margin-top:9px;
  padding:5px 8px 4px;
  font-family:var(--fdisp,'Bricolage Grotesque',system-ui,sans-serif);
  font-weight:800;
  font-size:13px;
  letter-spacing:.01em;
  text-transform:uppercase;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--fg);
  background:linear-gradient(90deg,
      transparent,
      color-mix(in srgb,var(--accent) 16%,transparent),
      transparent);
  border-top:1px solid color-mix(in srgb,var(--accent2) 45%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
}
.fut.big .fut-name{ font-size:18px; margin-top:12px; padding:6px 10px 5px; }

/* ============================================================
   STATS GRID (2 x 3)
   ============================================================ */
.fut-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px 10px;
  width:100%;
  margin-top:8px;
  font-size:10.5px;
}
.fut.big .fut-stats{ gap:6px 14px; margin-top:11px; font-size:12.5px; }

.fut-stats span{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:6px;
  padding:2px 5px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 90%,transparent);
}
.fut-stats b{
  font-family:var(--fdisp2,'Saira Condensed',system-ui,sans-serif);
  font-weight:800;
  font-variant-numeric:tabular-nums;
  font-size:1.28em;
  line-height:1;
  color:var(--fg);
  text-shadow:0 0 8px color-mix(in srgb,var(--accent2) 40%,transparent);
}
.fut-stats i{
  font-style:normal;
  font-family:var(--fmono,'IBM Plex Mono',monospace);
  font-weight:600;
  font-size:.86em;
  letter-spacing:.08em;
  color:var(--fg-mute);
  text-transform:uppercase;
}

/* ============================================================
   BADGE (superstar / legend tag)
   ============================================================ */
.fut-badge{
  position:absolute;
  top:0; left:var(--notch);
  z-index:6;
  padding:3px 12px 4px 9px;
  font-family:var(--fmono,'IBM Plex Mono',monospace);
  font-weight:700;
  font-size:8.5px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--bg);
  background:linear-gradient(90deg,var(--accent2),var(--accent));
  clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%);
  box-shadow:0 0 14px -4px var(--accent2);
}
.fut.big .fut-badge{ font-size:10px; padding:4px 16px 5px 12px; }

/* ============================================================
   FOIL / SHEEN OVERLAY
   ============================================================ */
.fut-sheen{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  background:linear-gradient(115deg,
      transparent 38%,
      color-mix(in srgb,var(--accent2) 28%,transparent) 47%,
      color-mix(in srgb,#fff 30%,transparent) 50%,
      color-mix(in srgb,var(--accent2) 28%,transparent) 53%,
      transparent 62%);
  background-size:250% 250%;
  background-position:140% 0;
  mix-blend-mode:screen;
  opacity:0;
  transition:opacity .3s ease,background-position .6s ease;
  clip-path:polygon(
    var(--notch) 0,100% 0,
    100% calc(100% - var(--notch)),
    calc(100% - var(--notch)) 100%,
    0 100%,0 var(--notch)
  );
}
.fut:hover .fut-sheen{ opacity:1; background-position:-40% 0; }

/* ============================================================
   TIER VARIANTS
   ============================================================ */

/* GOLD — electric cobalt energy (default Blue Lock) */
.fut.gold{
  --c1:var(--accent);
  --c2:var(--accent2);
  --frame:color-mix(in srgb,var(--accent2) 75%,transparent);
}

/* SILVER — cooler steel, muted cyan */
.fut.silver{
  --c1:#9fb4cf;
  --c2:#cfe0f4;
  --frame:color-mix(in srgb,#cfe0f4 60%,transparent);
  --plate:linear-gradient(157deg,#13203a 0%,#0c1426 50%,#070d18 100%);
}
.fut.silver .fut-ovr b,
.fut.silver .fut-stats b{ text-shadow:0 0 8px rgba(207,224,244,.5); }
.fut.silver .fut-mono{
  -webkit-text-stroke-color:rgba(207,224,244,.5);
}

/* BRONZE — dim copper-blue, lower glow */
.fut.bronze{
  --c1:#c98a52;
  --c2:#e0b487;
  --frame:color-mix(in srgb,#e0b487 50%,transparent);
  --plate:linear-gradient(157deg,#1a1626 0%,#120e1c 50%,#0a0810 100%);
}
.fut.bronze .fut-hero{
  background:
    radial-gradient(120% 80% at 70% 8%,rgba(201,138,82,.22),transparent 55%),
    linear-gradient(180deg,#120e1c,#0a0810);
}

/* SPECIAL — superstar electric cyan, maxed glow + pulse */
.fut.special{
  --c1:var(--accent2);
  --c2:#9af2ff;
  --frame:color-mix(in srgb,var(--accent2) 95%,transparent);
  --plate:radial-gradient(120% 90% at 50% 0%,#0a2a47 0%,#0a1322 55%,#04101d 100%);
  box-shadow:
    0 0 0 1px color-mix(in srgb,var(--accent2) 60%,transparent),
    0 14px 36px -14px rgba(0,0,0,.85),
    0 0 34px -10px var(--accent2);
  animation:hud-pulse 3.2s ease-in-out infinite;
}
@keyframes hud-pulse{
  0%,100%{ box-shadow:0 0 0 1px color-mix(in srgb,var(--accent2) 55%,transparent),0 14px 36px -14px rgba(0,0,0,.85),0 0 26px -12px var(--accent2); }
  50%    { box-shadow:0 0 0 1px color-mix(in srgb,var(--accent2) 80%,transparent),0 14px 36px -14px rgba(0,0,0,.85),0 0 40px -8px var(--accent2); }
}
.fut.special .fut-name{
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent2) 26%,transparent),transparent);
}

/* LEGEND — regal gold readout on deep navy */
.fut.legend{
  --c1:var(--gold);
  --c2:#fff0b0;
  --frame:color-mix(in srgb,var(--gold) 80%,transparent);
  --plate:linear-gradient(157deg,#11172a 0%,#0a1020 50%,#06090f 100%);
  box-shadow:
    0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent),
    0 14px 36px -14px rgba(0,0,0,.85),
    0 0 30px -12px color-mix(in srgb,var(--gold) 80%,transparent);
}
.fut.legend .fut-ovr{
  background:linear-gradient(155deg,color-mix(in srgb,var(--gold) 30%,var(--bg2)),var(--bg1));
  border-color:color-mix(in srgb,var(--gold) 60%,transparent);
  box-shadow:0 0 12px -4px color-mix(in srgb,var(--gold) 70%,transparent);
}
.fut.legend .fut-ovr span,
.fut.legend .fut-num{ color:var(--gold); }
.fut.legend .fut-ovr b,
.fut.legend .fut-stats b{ text-shadow:0 0 10px color-mix(in srgb,var(--gold) 60%,transparent); }
.fut.legend .fut-rdiv{ background:linear-gradient(90deg,transparent,var(--gold),transparent); box-shadow:0 0 6px color-mix(in srgb,var(--gold) 70%,transparent); }
.fut.legend .fut-mono{
  -webkit-text-stroke-color:color-mix(in srgb,var(--gold) 55%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 35%,transparent),transparent);
  text-shadow:0 0 22px color-mix(in srgb,var(--gold) 45%,transparent);
}
.fut.legend .fut-cap{ background:var(--gold); box-shadow:0 0 10px -2px var(--gold); }
.fut.legend .fut-badge{ background:linear-gradient(90deg,#fff0b0,var(--gold)); box-shadow:0 0 14px -4px var(--gold); }
.fut.legend .fut-hero::after,
.fut.legend::after{ border-color:var(--gold); filter:drop-shadow(0 0 3px var(--gold)); }

/* RISING — magenta-accented prospect */
.fut.rising{
  --c1:var(--magenta);
  --c2:#ff7db5;
  --frame:color-mix(in srgb,var(--magenta) 75%,transparent);
  --plate:linear-gradient(157deg,#221230 0%,#140a22 50%,#070411 100%);
}
.fut.rising .fut-ovr{
  background:linear-gradient(155deg,color-mix(in srgb,var(--magenta) 26%,var(--bg2)),var(--bg1));
  border-color:color-mix(in srgb,var(--magenta) 55%,transparent);
}
.fut.rising .fut-ovr span,
.fut.rising .fut-cap{ color:var(--bg); }
.fut.rising .fut-cap{ background:var(--magenta); }
.fut.rising .fut-ovr span{ color:#ff7db5; }
.fut.rising .fut-badge{ background:linear-gradient(90deg,#ff7db5,var(--magenta)); }

/* ---- reduced motion ---- */
@media (prefers-reduced-motion:reduce){
  .fut,.fut-hero::before,.fut.special{ animation:none !important; transition:none; }
  .fut:hover{ transform:none; }
}
