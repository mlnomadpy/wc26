  <style>:root{--bg:#050a16;--bg1:#0a1326;--bg2:#0f1f3e;--bg3:#173058;--line:#1b3260;--line2:#2c4d8c;--fg:#e9f2ff;--fg-dim:#90a6d0;--fg-mute:#5e7099;--accent:#2b8cff;--accent2:#56e0ff;--gold:#ffd23d;--magenta:#ff3d8b;--fdisp:'Bricolage Grotesque',sans-serif;--fdisp2:'Saira Condensed',sans-serif;--fmono:'IBM Plex Mono',monospace;--on-accent:#04122b;--sh:0 16px 44px -14px rgba(0,0,0,.78)}
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(900px 500px at 50% -10%,rgba(43,140,255,.14),transparent 60%),var(--bg);font-family:var(--fdisp);min-height:100vh;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;padding:34px}
  .lbl{color:var(--accent2);font-family:var(--fmono);font-size:13px;letter-spacing:.12em;text-transform:uppercase}

  /* ===== VARIANT: hex-frame ===== */
  /* ============================================================================
   HEX-FORGE — Blue Lock collectible card (hex / angular-frame direction)
   Self-contained. Uses global tokens: --accent --accent2 --gold --magenta
   --bg --bg1 --bg2 --bg3 --line --line2 --fg --fg-dim --fg-mute
   --fdisp --fdisp2 --fmono
   ============================================================================ */

/* octagonal hex-plate silhouette reused by frame layers */
.fut{
  --notch:16px;                 /* corner chamfer size */
  --c1:var(--accent);           /* tier primary  */
  --c2:var(--accent2);          /* tier secondary/glow */
  --ct:var(--fg);               /* tier text/ink on hero */
  --plate:
    polygon(
      var(--notch) 0, calc(100% - var(--notch)) 0,
      100% var(--notch), 100% calc(100% - var(--notch)),
      calc(100% - var(--notch)) 100%, var(--notch) 100%,
      0 calc(100% - var(--notch)), 0 var(--notch)
    );

  position:relative;
  display:flex;
  flex-direction:column;
  align-items:stretch;
  justify-content:flex-start;
  aspect-ratio:5/7;
  width:150px;
  max-width:100%;
  padding:0;
  gap:0;
  isolation:isolate;
  text-decoration:none;
  color:var(--fg);
  font-family:var(--fdisp);

  /* the body plate: deep navy with a diagonal energy wash */
  background:
    linear-gradient(150deg,
      color-mix(in srgb,var(--c2) 16%,transparent) 0%,
      transparent 32%),
    linear-gradient(160deg, var(--bg2) 0%, var(--bg1) 46%, var(--bg) 100%);
  clip-path:var(--plate);
  filter:drop-shadow(0 14px 30px rgba(0,0,0,.55));
  transition:transform .22s cubic-bezier(.2,.7,.3,1), filter .22s ease;
  cursor:pointer;
}

/* OUTER glowing energy ring (sits just outside, drawn behind via ::before) */
.fut::before{
  content:"";
  position:absolute;
  inset:-2px;
  z-index:0;
  clip-path:var(--plate);
  background:
    conic-gradient(from var(--beam,0deg),
      transparent 0deg,
      color-mix(in srgb,var(--c2) 90%,white) 26deg,
      var(--c1) 60deg,
      transparent 120deg,
      transparent 240deg,
      color-mix(in srgb,var(--c2) 70%,transparent) 300deg,
      transparent 360deg);
  /* fall back to a static double-glow border for the bulk of the edge */
  box-shadow:
    0 0 0 1.5px color-mix(in srgb,var(--c1) 70%,transparent),
    0 0 22px -4px var(--c2),
    0 0 46px -10px var(--c1);
  animation:hexbeam 5.5s linear infinite;
}

/* INNER frame: the chamfered hairline + corner ticks */
.fut::after{
  content:"";
  position:absolute;
  inset:5px;
  z-index:5;
  pointer-events:none;
  clip-path:var(--plate);
  background:
    /* corner accent ticks */
    linear-gradient(var(--c2),var(--c2)) left 0 top 14px/2px 22px no-repeat,
    linear-gradient(var(--c2),var(--c2)) right 0 bottom 14px/2px 22px no-repeat,
    linear-gradient(var(--c2),var(--c2)) left 14px top 0/22px 2px no-repeat,
    linear-gradient(var(--c2),var(--c2)) right 14px bottom 0/22px 2px no-repeat;
  box-shadow:
    inset 0 0 0 1px color-mix(in srgb,var(--line2) 80%,transparent),
    inset 0 0 0 2px color-mix(in srgb,var(--bg) 90%,transparent);
}

.fut:hover{
  transform:translateY(-8px) scale(1.015);
  filter:drop-shadow(0 26px 48px rgba(0,0,0,.6))
         drop-shadow(0 0 24px color-mix(in srgb,var(--c2) 45%,transparent));
}

@keyframes hexbeam{ to{ --beam:360deg; } }
@property --beam{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
@media (prefers-reduced-motion:reduce){ .fut::before{ animation:none } }

/* ---- foil / scanline overlay ---------------------------------------------- */
.fut-sheen{
  position:absolute;
  inset:5px;
  z-index:4;
  pointer-events:none;
  clip-path:var(--plate);
  background:
    repeating-linear-gradient(0deg,
      rgba(255,255,255,.035) 0 1px,
      transparent 1px 3px),
    linear-gradient(115deg,
      transparent 38%,
      color-mix(in srgb,var(--c2) 40%,transparent) 49%,
      transparent 60%);
  background-size:100% 100%, 250% 100%;
  background-position:0 0, 140% 0;
  mix-blend-mode:screen;
  opacity:.55;
  transition:background-position .6s cubic-bezier(.2,.7,.3,1);
}
.fut:hover .fut-sheen{ background-position:0 0, -40% 0; }

/* ---- SUPERSTAR badge ------------------------------------------------------ */
.fut-badge{
  position:absolute;
  top:0; left:50%;
  transform:translateX(-50%);
  z-index:8;
  font-family:var(--fdisp);
  font-weight:800;
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
  padding:4px 14px 5px;
  color:var(--bg);
  background:linear-gradient(180deg,var(--c2),var(--c1));
  clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 100%,0 100%);
  box-shadow:0 2px 12px -2px var(--c2), inset 0 1px 0 rgba(255,255,255,.5);
}

/* ============================ HERO / PORTRAIT ============================== */
.fut-hero{
  position:relative;
  flex:1;
  width:100%;
  min-height:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* portrait photo (may be absent) */
.fut-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 14%;
  z-index:1;
}

/* hero energy scrim so the left rail always reads + bottom fade into name band */
.fut-hero::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  background:
    linear-gradient(100deg,
      color-mix(in srgb,var(--bg) 88%,transparent) 0 16%,
      color-mix(in srgb,var(--bg) 28%,transparent) 36%,
      transparent 54%),
    linear-gradient(0deg,
      var(--bg1) 0%,
      color-mix(in srgb,var(--bg1) 50%,transparent) 16%,
      transparent 34%),
    radial-gradient(120% 80% at 70% 8%,
      color-mix(in srgb,var(--c2) 14%,transparent), transparent 60%);
}

/* ---- MONOGRAM as intentional focal HUD graphic ---------------------------- */
/* big hexagon motif drawn behind a ghosted monogram */
.fut-mono{
  position:absolute;
  z-index:2;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--fdisp2);
  font-weight:800;
  font-size:64px;
  letter-spacing:1px;
  line-height:1;
  color:transparent;
  -webkit-text-stroke:2px color-mix(in srgb,var(--c2) 70%,transparent);
  text-shadow:0 0 24px color-mix(in srgb,var(--c2) 35%,transparent);
}
/* the hexagon plate sitting behind the initials */
.fut-mono::before{
  content:"";
  position:absolute;
  width:78%;
  aspect-ratio:1/1;
  clip-path:polygon(50% 2%,95% 26%,95% 74%,50% 98%,5% 74%,5% 26%);
  background:
    radial-gradient(circle at 50% 40%,
      color-mix(in srgb,var(--c1) 22%,transparent),
      transparent 70%);
  box-shadow:
    inset 0 0 0 1.5px color-mix(in srgb,var(--c2) 45%,transparent),
    inset 0 0 0 8px color-mix(in srgb,var(--bg) 0%,transparent);
  filter:drop-shadow(0 0 16px color-mix(in srgb,var(--c2) 30%,transparent));
  animation:hexpulse 3.6s ease-in-out infinite;
}
/* faint inner hex outline for HUD depth */
.fut-mono::after{
  content:"";
  position:absolute;
  width:54%;
  aspect-ratio:1/1;
  clip-path:polygon(50% 2%,95% 26%,95% 74%,50% 98%,5% 74%,5% 26%);
  border:0;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c2) 28%,transparent);
  opacity:.7;
}
@keyframes hexpulse{
  0%,100%{ transform:scale(1); opacity:.9 }
  50%{ transform:scale(1.04); opacity:1 }
}
@media (prefers-reduced-motion:reduce){ .fut-mono::before{ animation:none } }
/* hide monogram graphic when a real photo is present */
.fut-hero:has(.fut-img){ }
.fut-img + .fut-mono,
.fut-hero:has(.fut-img) .fut-mono{ opacity:.18; }

/* ---- LEFT VERTICAL RAIL: OVR · POS · flag · num · cap --------------------- */
.fut-rail{
  position:absolute;
  top:10px; left:10px;
  z-index:6;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  line-height:1;
  color:var(--ct);
}
.fut-ovr{
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:.8;
}
.fut-ovr b{
  font-family:var(--fdisp2);
  font-weight:800;
  font-size:34px;
  letter-spacing:.5px;
  line-height:.78;
  color:var(--c2);
  text-shadow:0 0 14px color-mix(in srgb,var(--c2) 55%,transparent);
}
.fut-ovr span{
  font-family:var(--fdisp2);
  font-weight:700;
  font-size:11px;
  letter-spacing:.12em;
  margin-top:2px;
  color:var(--fg);
  opacity:.92;
}
.fut-rdiv{
  width:24px;
  height:2px;
  margin:2px 0;
  background:linear-gradient(90deg,transparent,var(--c2),transparent);
  box-shadow:0 0 8px color-mix(in srgb,var(--c2) 60%,transparent);
}
.flagi{
  width:22px;
  border-radius:2px;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--line2) 90%,transparent),0 1px 4px rgba(0,0,0,.5);
}
.fut-num{
  font-family:var(--fdisp2);
  font-weight:700;
  font-size:12px;
  color:var(--fg-dim);
}
.fut-cap{
  font-family:var(--fdisp2);
  font-weight:800;
  font-size:9px;
  color:var(--bg);
  background:var(--c2);
  width:15px; height:15px;
  display:flex; align-items:center; justify-content:center;
  clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  box-shadow:0 0 8px color-mix(in srgb,var(--c2) 60%,transparent);
}

/* ============================ NAME BAND =================================== */
.fut-name{
  position:relative;
  z-index:6;
  font-family:var(--fdisp);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.01em;
  font-size:14px;
  width:100%;
  text-align:center;
  padding:6px 10px 5px;
  margin-top:-1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--fg);
  background:linear-gradient(180deg,var(--bg1),var(--bg));
  border-top:1.5px solid color-mix(in srgb,var(--c2) 45%,transparent);
  box-shadow:0 -1px 12px -4px color-mix(in srgb,var(--c2) 60%,transparent);
}
/* angular notch echo on the name band edges */
.fut-name::before{
  content:"";
  position:absolute;
  left:0; top:0;
  width:14px; height:2px;
  background:var(--c2);
  box-shadow:0 0 8px var(--c2);
}
.fut-name::after{
  content:"";
  position:absolute;
  right:0; top:0;
  width:14px; height:2px;
  background:var(--c2);
  box-shadow:0 0 8px var(--c2);
}

/* ============================ STAT GRID 2x3 =============================== */
.fut-stats{
  position:relative;
  z-index:6;
  font-family:var(--fdisp2);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px 16px;
  width:100%;
  margin:0;
  padding:8px 14px 14px;
  background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 80%,#000));
}
.fut-stats span{
  display:flex;
  align-items:baseline;
  gap:7px;
  justify-content:flex-start;
}
.fut-stats b{
  font-family:var(--fdisp2);
  font-weight:800;
  font-size:15px;
  font-variant-numeric:tabular-nums;
  min-width:20px;
  text-align:right;
  letter-spacing:.4px;
  color:var(--fg);
}
.fut-stats i{
  font-style:normal;
  font-weight:600;
  font-size:9px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--fg-mute);
}

/* ============================ BIG VARIANT ================================= */
.fut.big{
  --notch:22px;
  width:264px;
}
.fut.big .fut-badge{ font-size:11px; padding:5px 18px 6px; }
.fut.big .fut-mono{ font-size:96px; -webkit-text-stroke:3px color-mix(in srgb,var(--c2) 70%,transparent); }
.fut.big .fut-rail{ top:14px; left:14px; gap:5px; }
.fut.big .fut-ovr b{ font-size:50px; }
.fut.big .fut-ovr span{ font-size:14px; }
.fut.big .fut-rdiv{ width:32px; }
.fut.big .flagi{ width:30px; }
.fut.big .fut-num{ font-size:15px; }
.fut.big .fut-cap{ width:18px; height:18px; font-size:11px; }
.fut.big .fut-name{ font-size:20px; padding:9px 12px 7px; }
.fut.big .fut-stats{ font-size:18px; gap:4px 24px; padding:11px 18px 18px; }
.fut.big .fut-stats b{ font-size:19px; }
.fut.big .fut-stats i{ font-size:11px; }

/* ============================ TIER VARIANTS =============================== */
/* SPECIAL — electric cyan superstar (the signature Blue Lock look) */
.fut.special{
  --c1:var(--accent);
  --c2:var(--accent2);
  --ct:var(--fg);
  background:
    linear-gradient(150deg, color-mix(in srgb,var(--accent2) 22%,transparent) 0%, transparent 34%),
    linear-gradient(160deg,#0c1f44 0%, var(--bg1) 50%, var(--bg) 100%);
}

/* LEGEND — regal gold/cyan duo, the project-world-champion grail */
.fut.legend{
  --c1:var(--gold);
  --c2:var(--accent2);
  --ct:var(--fg);
  background:
    linear-gradient(150deg, color-mix(in srgb,var(--gold) 20%,transparent) 0%, transparent 32%),
    linear-gradient(160deg,#1a1632 0%, #0c1430 48%, var(--bg) 100%);
}
.fut.legend .fut-ovr b{ color:var(--gold); text-shadow:0 0 16px color-mix(in srgb,var(--gold) 55%,transparent); }
.fut.legend .fut-name{ color:var(--gold); }
.fut.legend .fut-badge{ color:#1c1503; background:linear-gradient(180deg,#ffe488,var(--gold)); }

/* GOLD — warm metal tint over navy */
.fut.gold{
  --c1:var(--gold);
  --c2:#ffe488;
  --ct:var(--fg);
  background:
    linear-gradient(150deg, color-mix(in srgb,var(--gold) 16%,transparent) 0%, transparent 34%),
    linear-gradient(160deg,#15182a 0%, var(--bg1) 50%, var(--bg) 100%);
}
.fut.gold .fut-ovr b{ color:var(--gold); text-shadow:0 0 14px color-mix(in srgb,var(--gold) 50%,transparent); }
.fut.gold .fut-name{ color:color-mix(in srgb,var(--gold) 85%,var(--fg)); }
.fut.gold .fut-badge{ color:#1c1503; background:linear-gradient(180deg,#ffe488,var(--gold)); }

/* SILVER — cool steel tint */
.fut.silver{
  --c1:#b8c6dc;
  --c2:#e2ecf8;
  --ct:var(--fg);
  background:
    linear-gradient(150deg, color-mix(in srgb,#e2ecf8 14%,transparent) 0%, transparent 34%),
    linear-gradient(160deg,#141b2c 0%, var(--bg1) 52%, var(--bg) 100%);
}
.fut.silver .fut-ovr b{ color:#e2ecf8; }
.fut.silver .fut-badge{ color:#1f2c3a; background:linear-gradient(180deg,#fff,#b8c6dc); }

/* BRONZE — earthy copper tint */
.fut.bronze{
  --c1:#cf8a4e;
  --c2:#e6a967;
  --ct:var(--fg);
  background:
    linear-gradient(150deg, color-mix(in srgb,#cf8a4e 14%,transparent) 0%, transparent 34%),
    linear-gradient(160deg,#1c1622 0%, var(--bg1) 52%, var(--bg) 100%);
}
.fut.bronze .fut-ovr b{ color:#e6a967; }
.fut.bronze .fut-badge{ color:#2b1a0c; background:linear-gradient(180deg,#f3c08a,#cf8a4e); }

/* RISING — high-voltage magenta/cyan prospect */
.fut.rising{
  --c1:var(--magenta);
  --c2:var(--accent2);
  --ct:var(--fg);
  background:
    linear-gradient(150deg, color-mix(in srgb,var(--magenta) 18%,transparent) 0%, transparent 34%),
    linear-gradient(160deg,#2a1130 0%, #0c1430 50%, var(--bg) 100%);
}
.fut.rising .fut-ovr b{ color:var(--accent2); }
.fut.rising .fut-badge{ color:var(--bg); background:linear-gradient(180deg,var(--accent2),var(--magenta)); }
